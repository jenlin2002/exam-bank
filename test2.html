<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第2次平時考 - Lesson 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .tabs{display:flex;gap:8px;}
  .tab-btn{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:15px;
    padding:9px 18px;
    border:2px solid var(--chalk-green);
    background:transparent;
    color:var(--chalk-green);
    border-radius:999px 999px 0 0;
    cursor:pointer;
  }
  .tab-btn[aria-selected="true"]{background:var(--chalk-green);color:#fff;}
  .tab-btn[disabled]{
    opacity:.45;cursor:not-allowed;border-color:var(--ink-soft);color:var(--ink-soft);
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  .coming-soon{
    text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;
  }

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第2次平時考・Lesson 2</h1>
    <p class="subtitle">How Often Do You Clean Your Room?｜康軒版七年級英語（二）</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="tabs" id="versionTabs" role="tablist"></div>
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="index.html">← 回段考題庫總覽</a>
</main>

<script>

const DATA = {
  A: {
    label: "A卷",
    sections: [
      {
        type: "vocab",
        title: "一、文意字彙",
        meta: "20分，每題2分",
        items: [
          {q:"The math problem is hard. Only one student in my class knows the a___r.", answer:"answer"},
          {q:"A: May I use the t___t in your house? B: Sure. The bathroom is next to the kitchen.", answer:"toilet"},
          {q:"The kitchen f___r is really dirty. Go and mop it now.", answer:"floor"},
          {q:"There are many terrible things in the world, and Lila wants to c___e them for the good.", answer:"change"},
          {q:"There's lots of great food（食物）at the market（市場）at night. I like to go there for dinner.", answer:"market"},
          {q:"Jack drinks tea after breakfast every morning. It's his h___t.", answer:"habit"},
          {q:"Little Tim is using his f___rs to eat the cake. He can't use a fork（叉子）.", answer:"fingers"},
          {q:"Howard, please clean your room now. There's a lot of t___h in it.", answer:"trash"},
          {q:"Andrew likes fruits, for e___e, grapes, oranges, and strawberries.", answer:"example"},
          {q:"Max and Jim are brothers! I can't b___e it! They're so different.", answer:"believe"}
        ]
      },
      {
        type:"mc",
        title:"二、語法測驗",
        meta:"24分，每題2分",
        items:[
          {q:"Ben: ___ do you practice tennis after school? Ian: I seldom practice it. I'm really busy.",options:["Where","How much","Which","How often"],correct:3},
          {q:"Jenny ___ a lot of fish for dinner. Fish is her favorite（最愛）.",options:["always eats","eats always","never eats","eats never"],correct:0},
          {q:"Vicky ___ busy（忙碌的）this month. She has more free time with family.",options:["is always","always is","is seldom","seldom is"],correct:2},
          {q:"Helen visits（拜訪）Taiwan ___. For her, the people there are great.",options:["every two month","every two months","two every month","two every months"],correct:1},
          {q:"Sally: Do you always cook dinner? Tom: No, ___. I eat out every day.",options:["usually","sometimes","never","always"],correct:2},
          {q:"Jay: I like soccer. What ___ you? Joe: I don't. It's hard for me.",options:["about","do","are","also"],correct:0},
          {q:"Joseph is my best（最好的）friend. We chat after school very ___.",options:["often","always","usually","sometimes"],correct:0},
          {q:"Ann: How often do you go to the library? Ed: ___ I like to study there on weekends.",options:["At ten.","Twice a week.","In May.","This weekend."],correct:1},
          {q:"Jimmy: ___ run in the museum（博物館）, Mary. Mary: I am sorry.",options:["Always","Never","Often","Seldom"],correct:1},
          {q:"The man knows a lot about fruit. He may ___ a farmer.",options:["am","is","are","be"],correct:3},
          {q:"Meg ___ eats strawberries or papayas. In fact, she only likes apples.",options:["doesn't","can't","also","seldom"],correct:3},
          {q:"I sometimes get up at 5:30 and take a walk in the park, but my brother, Joe, ___.",options:["does never","never does","is never","never is"],correct:1}
        ]
      },
      {
        type:"mc",
        title:"三、完成句子與對話",
        meta:"6分，每題2分",
        items:[
          {q:"Susan: ___ Joe: I study English four times a week.",options:["Do you study English after school every day?","How often do you study English?","Can you do the English homework with me?","What do you study every day?"],correct:1},
          {q:"Brian: Do you always eat eggs for breakfast? Ann: ___ In fact, I don't like eggs.",options:["Yes, I always cook breakfast for my sister.","No, I seldom eat eggs for breakfast.","Yes, I go to the market to get eggs once a week.","No, those eggs are not free."],correct:1},
          {q:"Jack: We can help（幫助）our parents with some housework. Ivy: ___",options:["I never have any free time on weekends.","I never mop the floor.","For example, we can do the dishes.","My parents don't believe me."],correct:2}
        ]
      },
      {
        type:"guided",
        title:"四、依提示作答",
        meta:"15分，每題3分",
        items:[
          {prompt:"Jason. / play / with / We / tennis / never",hint:"（重組句子）",answer:"We never play tennis with Jason."},
          {prompt:"Robin exercises on the sports field after school five times a week.",hint:"（依畫線部分造原問句）",answer:"How often does Robin exercise on the sports field after school?"},
          {prompt:"Aaron goes to the library in the evening.",hint:"（加入seldom並改寫）",answer:"Aaron seldom goes to the library in the evening."},
          {prompt:"Do you sometimes practice dancing at home?",hint:"（肯定詳答）",answer:"Yes, I sometimes practice dancing at home."},
          {prompt:"I usually read books. My brother never reads books.",hint:"（合併句子，且後句以簡述句改寫）",answer:"I usually read books, but my brother never does."}
        ]
      },
      {
        type:"translation",
        title:"五、整句式翻譯",
        meta:"15分，每題3分",
        items:[
          {zh:"你可以幫我擺碗盤嗎？",answer:"Can you set the table for me?"},
          {zh:"Hank 每週去一次市場。",answer:"Hank goes to the market once a week."},
          {zh:"他每天倒三次垃圾。這是他的習慣。",answer:"He takes out the trash three times a day. It's his habit."},
          {zh:"有時候我相信他，但有時候不。",answer:"Sometimes I believe him, but sometimes I don't."},
          {zh:"A：你多久清理馬桶一次？B：一天兩次。",answer:"A: How often do you clean the toilet? B: Twice a day."}
        ]
      },
      {
        type:"cloze",
        title:"六、克漏字測驗",
        meta:"10分，每題2分",
        passage:"Sandra is a doctor in the USA. She helps her patients with their skin problems every day. __1__. The problems are really hard, and everything is __2__. Every patient around her is scared, but she doesn't __3__ her ways of helping them. She has many patients, so she often works long time. Sandra is a mother of two boys. Her sons are junior high school students. They have acne on their faces now, and they __4__ about that. They want their mother's help. Sandra is tired after work, but she always chats with them and listens to them. She helps them with their problems. Sandra seldom mops the floor at home or prepares dinner for her family. But in her sons' eyes, she is __5__ a great and cool mother.",
        items:[
          {options:["Sometimes","Always","Seldom","Never"],correct:0},
          {options:["true","terrible","clean","free"],correct:1},
          {options:["check","kill","change","believe"],correct:2},
          {options:["often worry","worry often","seldom worry","worry seldom"],correct:0},
          {options:["never is","is never","always is","is always"],correct:3}
        ]
      },
      {
        type:"reading",
        title:"七、閱讀測驗",
        meta:"10分，每題2分",
        passages:[
          {
            label:"【A】",
            text:"People around the world like to shop online. But how often do they shop online? Here are the statistics.\n[表格] City｜Once a week｜Twice a week｜Two or three times a month\nBeijing 25% / 38% / 32%　Seoul 25% / 35% / 30%　Tokyo 30% / 6% / 40%",
            items:[
              {q:"There are about 9.8 million people in Seoul. ___? people in Seoul shop online two or three times a month.",options:["2.94 million.","3.43 million.","0.59 million.","2.45 million."],correct:0},
              {q:"Which is NOT true about the statistics?",options:["Only 6% of people in Tokyo shop online twice a week.","32% of people in Beijing shop online twice a week.","25% of people in Seoul shop online once a week.","40% of people in Tokyo shop online two or three times a month."],correct:1}
            ]
          },
          {
            label:"【B】",
            text:"Hi, everyone. I'm a water taster from Taiwan. For a lot of people, water from every city around the world is the same, but in fact, it is really different. Water tasters go to a lot of cities and drink a lot of water with teachers. Those teachers show us the right way of drinking water and share special information with us. We must read a lot of books every day, too. Some books are in English. I'm not good at English, so I study English from 8 to 10 a.m. every day now.\nWhat do water tasters do in Taiwan? We go to nice restaurants every day. Some people can't choose the right water. We chat with them and help them with that. We have meetings with water tasters around the world every week, and we can know a lot of new things about water. Then we practice tasting water again and again. It is hard for my friends, but it can be a lot of fun for me.",
            items:[
              {q:"What does \"that\" refer to?",options:["Studying water.","Choosing water.","Studying English.","Reading books."],correct:1},
              {q:"What DON'T water tasters in Taiwan do?",options:["They go to nice restaurants.","They have meetings with water tasters around the world.","They practice tasting water again and again.","They choose water for their teachers."],correct:3},
              {q:"Which is NOT true about water tasters?",options:["Every water taster is good at English.","They go to a lot of cities.","They drink a lot of water with teachers.","They read a lot of books every day."],correct:0}
            ]
          }
        ]
      }

    ]
  }
};

let currentVersion = "A";
let currentMode = "quiz"; // quiz | print

const tabsEl = document.getElementById("versionTabs");
const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function buildTabs(){
  tabsEl.innerHTML = "";
  ["A","B","C"].forEach(v=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.textContent = v + "卷" + (DATA[v] ? "" : "（即將推出）");
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", v===currentVersion ? "true":"false");
    if(!DATA[v]) btn.disabled = true;
    btn.addEventListener("click", ()=>{ currentVersion = v; render(); });
    tabsEl.appendChild(btn);
  });
}

function render(){
  buildTabs();
  window.EXAM_META = { version: currentVersion + "卷", examLabel: "第2次" };
  window.examAnswersRevealed = false;
  const data = DATA[currentVersion];
  if(!data){
    contentEl.innerHTML = `<div class="coming-soon">📄 ${currentVersion}卷內容整理中，之後會陸續加入題庫。</div>`;
    scoreBar.classList.remove("show");
    return;
  }
  contentEl.innerHTML = "";
  data.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    // reveal everything for print/reading mode
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div><div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="sync.js"></script>
</body>
