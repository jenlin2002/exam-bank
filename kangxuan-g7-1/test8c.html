<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第8回 - Review 2（二）（C卷）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g7-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第8回・Review 2（二）</h1>
    <p class="subtitle">Review 2（二）｜康軒版七年級英語（一）Ｃ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g7-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "C卷", examLabel: "第8回" };
const DATA = {
  sections: [
    {
      type:"mc",
      title:"第一部分",
      meta:"題號1~20，請依據題意選出一個正確或最佳的答案。每題2分，共40分",
      items:[
        {q:"A: ___ is my smartphone? B: It is on the table in the kitchen.",options:["Who","What","Where","How"],correct:2},
        {q:"Please ___ and come with me. Mr. and Mrs. Wu want to talk to you.",options:["sit down","watch out","check out","stand up"],correct:0},
        {q:"A: That building（建築物）is very special. B: Yes, it is. That's my ___ house.",options:["aunt's and uncle's","aunt and uncle's","aunts and uncles","aunt and uncle"],correct:1},
        {q:"Where is the ___? I want to take a shower（沖澡）.",options:["classroom","bedroom","bathroom","living room"],correct:2},
        {q:"It's warm and sunny（晴朗的）today. ___ go out and play.",options:["Let","Let's","Don't","Aren't"],correct:1},
        {q:"My sisters are ___ school, not ___ the park.",options:["under; in","at; between","at; in","between; at"],correct:2},
        {q:"A: ___ you read Chinese? B: No, I can't.",options:["Am","Can","Are","Is"],correct:1},
        {q:"Don't make any ___, Kevin. Mom is sleeping（正在睡覺）in the bedroom.",options:["themes","ice","ideas","noise"],correct:3},
        {q:"A: ___ can you do? B: I can write songs.",options:["Who","How","What","Where"],correct:2},
        {q:"A: ___ B: It's my smartphone.",options:["Are they your smartphones?","Where is your smartphone?","What's that under the blanket?","What are those near the desk?"],correct:2},
        {q:"My brother ___ dance, but my sister can.",options:["is","can","isn't","can't"],correct:3},
        {q:"It's cold here. I want a ___ to keep（保持）warm.",options:["step","lane","question","blanket"],correct:3},
        {q:"Look! The lion is energetic! Let's take a ___.",options:["photo","tool","world","smartphone"],correct:0},
        {q:"A: Can you please be quiet? Don't ___. B: OK. I'm sorry.",options:["wait","choose","listen","talk"],correct:3},
        {q:"I really like that watch, but I can't buy（買）it. It's too ___.",options:["soft","hard","quiet","expensive"],correct:3},
        {q:"A: What ___ your pet rabbit do? B: It ___ jump.",options:["can; can","is; can","can't; is","is; can't"],correct:0},
        {q:"Please ___ in this room. You can see Mr. Wilson in 20 minutes（分鐘）.",options:["download","cross","wait","design"],correct:2},
        {q:"Doris is my pet rabbit. ___, she is our family pet.",options:["In fact","Take a look","That's right","Same here"],correct:0},
        {q:"A: Please sit down and ___ make noise. B: OK.",options:["not","don't","can't","no"],correct:1},
        {q:"That is Duke in the picture. It is Ruby's dog, and it is beside ___.",options:["her","she","its","I"],correct:0}
      ]
    },
    {
      type:"reading",
      title:"第二部分",
      meta:"題號21~40，四個題組，請依據所附選文或圖表資料，選出一個正確或最佳的答案。每題3分，共60分",
      passages:[
        {
          label:"【21～25】",
          text:"Patty: Hey, Luke. ___21___ is that in your bag?\nLuke: It's a great book.\nPatty: What is it about?\nLuke: People from different countries. You ___22___ see some photos in the book. They are cool.\nPatty: Really? Show me.\nLuke: Look at this photo! This woman is ___23___ South Africa（南非）. Her lips are thick.\nPatty: ___24___ They are very thick.\nLuke: Yes. In her country, women with thick lips are ___25___.\nPatty: I see.\n\n【字詞】country 國家　show 展示　lip 嘴脣　thick 厚的",
          items:[
            {q:"21.",options:["Where","Who","How","What"],correct:3},
            {q:"22.",options:["can't","can","aren't","are"],correct:1},
            {q:"23.",options:["on","behind","from","under"],correct:2},
            {q:"24.",options:["That's special!","Where are they?","How is she?","What's this?"],correct:0},
            {q:"25.",options:["soft","noisy","beautiful","late"],correct:2}
          ]
        },
        {
          label:"【26～30】",
          text:"Look! This is Jack's schoolbag. It is very heavy. What's in his schoolbag? Let's take a look.\nYou can see five textbooks in it. You can also see two yellow robots and a pencil box. What's in the pencil box? Two blue pens, one red pen, one green pen, one eraser, and one ruler.\nWhat else is in Jack's schoolbag? A comic book! Oh, no! He can't bring it to school!\n\n【字詞】schoolbag 書包　heavy 重的　textbook 教科書　else 其他的　comic book 漫畫書　bring 攜帶",
          items:[
            {q:"26. What color are the two robots?",options:["Red.","Green.","Yellow.","Blue."],correct:2},
            {q:"27. What CAN'T we see in the pencil box?",options:["An eraser.","A pencil.","A ruler.","A red pen."],correct:1},
            {q:"28. We can see ___ textbooks in the schoolbag.",options:["two","three","five","four"],correct:2},
            {q:"29. What is \"it\"（畫線部分，指 bring it to school 中的 it）?",options:["The schoolbag.","The ruler.","The pencil box.","The comic book."],correct:3},
            {q:"30. What is right about the schoolbag?",options:["It is not heavy.","It is Jack's schoolbag.","You can see some blue robots in it.","You can see two pencil boxes in it."],correct:1}
          ]
        },
        {
          label:"【31～35】",
          text:"Look at this house. You can see two bedrooms, one kitchen, and one living room. There is a nice bathroom between the kitchen and one bedroom. You can't see any stairs in the house. So, it is good for old people.\nThis house is in the country. You can see mountains behind the house and a lake in front of it. You can also see a park beside the house.\nThis house is great and special. Come and take a look!\n\n【字詞】there is 有……　stair 樓梯　so 所以　country 鄉下　mountain 山　lake 湖",
          items:[
            {q:"31. Where is the kitchen?",options:["Next to the bathroom.","Between the two bedrooms.","In front of the house.","Behind the house."],correct:0},
            {q:"32. We can see ___ bedrooms in this house.",options:["five","four","three","two"],correct:3},
            {q:"33. There is a lake ___ the house.",options:["in","behind","in front of","next to"],correct:2},
            {q:"34. Which is the house?",image:"images/test8c/house_plan.png",options:["A","B","C","D"],correct:0},
            {q:"35. Which is true?",options:["The house is good for old people.","You can see stairs in the house.","The house is behind the mountains.","The park is behind the house."],correct:0}
          ]
        },
        {
          label:"【36～40】",
          text:"Hello, class. Welcome to Class 705. My name is Albert Jobs. I'm your homeroom teacher, and I'm also your math teacher. Here are some rules. Please follow them.\n\nClass 705 Rules\n1. Don't be late for school.\n2. Don't make any noise in class.\n3. Be nice to other people.\n4. Don't eat or drink in class.\n5. Don't run in the classroom.\n6. Don't leave your trash in the classroom.\n7. Don't use your smartphone in class.\n\nOh, and the woman next to me is my wife, Mrs. Jobs. She is your PE teacher. She is beautiful, right?\n\n【字詞】homeroom teacher 導師　rule 規定　follow 遵守　leave 留下　trash 垃圾",
          items:[
            {q:"36. Which is true about Albert?",options:["He is in the bedroom now.","He is a math teacher.","His wife is a nurse.","He is a new student in Class 705."],correct:1},
            {q:"37. What are \"them\"（畫線部分，指 follow them 中的 them）?",options:["The rules.","The classes.","The students.","The teachers."],correct:0},
            {q:"38. Tommy broke Rule 3. Which is the right picture?",image:"images/test8c/rule3.png",options:["A","B","C","D"],correct:3},
            {q:"39. Nancy broke Rule 7. Which is the right picture?",image:"images/test8c/rule7.png",options:["A","B","C","D"],correct:2},
            {q:"40. Which is NOT the rule in Class 705?",options:["Be quiet in class.","Be nice to other people.","Don't talk on the smartphone in class.","Don't leave your books in the classroom."],correct:3}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
        <div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
