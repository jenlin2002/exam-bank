<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第3回 - Review 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g7-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第3回・Review 1</h1>
    <p class="subtitle">Review 1（Lesson 1~2 總複習）｜康軒版七年級英語（一）Ａ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g7-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第3回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"The new m___e is great! It's about a boy and his pet sheep.", answer:"movie"},
        {q:"Noah is a great n___e. He is a great help（幫手）to the doctors.", answer:"nurse"},
        {q:"The shoes aren't the same s___e. These are big, and those are small.", answer:"size"},
        {q:"Those beautiful w___n are my aunts. They're my mother's sisters.", answer:"women"},
        {q:"I have a w___m family. My mom and dad are nice. My sister is nice, too.", answer:"warm"},
        {q:"I like Ms. Smith's English c___s. It's fun（有趣的）, and she's a great teacher.", answer:"class"},
        {q:"Paul: Hi, I'm a new student here. I'm Paul. Joe: Nice to m___t you, Paul.", answer:"meet"},
        {q:"Gill: Jim is Ms. Chen's son, right? Vic: No, it's not t___e. He's Ms. Li's son.", answer:"true"},
        {q:"Daniel: How old are your p___ts? Batty: My dad is 80 years old, and my mom is 77 years old.", answer:"parents"},
        {q:"Hugo: What are those animals? Helen: They're m___ys. They like bananas, and they climb（爬）trees.", answer:"monkeys"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Hank: Are you and your sister doctors? Enya: ___ I'm a farmer, and my sister's an English teacher.",options:["Yes, I'm.","No, she's not.","Yes, you are.","No, we aren't."],correct:3},
        {q:"Mr. Ma is these ___ teacher. He is nice.",options:["girl's","girls'","girl","girls"],correct:1},
        {q:"Alice: The black mouse is scary（令人害怕的）. Is this your pet? David: No, ___.",options:["this is not","this is","it's not","it is"],correct:2},
        {q:"Maple: ___ are they? Are they watches? Sierra: Yes, they're my grandfather's watches.",options:["What","Who","How old","How"],correct:0},
        {q:"Rita: Is ___? Tony: Yes, he is. He is a baseball player（棒球選手）.",options:["that tall boy","tall that boy","tall boy","that boy tall"],correct:3},
        {q:"Vita: ___ in the park? Mike: Amy and Ken are. They're on the swings（鞦韆）.",options:["What are","How are","Who is","What is"],correct:2},
        {q:"___ is my son. He is a nice cook.",options:["That","These","Those","It"],correct:0},
        {q:"Alex and Peter are Gina's brothers. Gina is ___ sister.",options:["his","our","their","your"],correct:2},
        {q:"Joey: Is her dad, Mr. Liu, a thin man? Lucy: No, ___. Mr. Liu is a fat and old man.",options:["her isn't","he's not fat","she isn't","he isn't"],correct:3},
        {q:"Chris: What are those on the table? Bob: ___ toy cars. I bought（買）them today.",options:["Their","They're","It's","We're"],correct:1},
        {q:"This school is big and beautiful. It is those ___ school, too.",options:["person's","person","peoples","people's"],correct:3},
        {q:"Gina: Are these your ___? Ed: Yes, they are cute.",options:["goat","sheep","mouse","rooster"],correct:1}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Mandy: ___ I'm a rabbit. Jerry: I'm a rabbit, too!",options:["How old are you?","Who are you?","What's your animal sign?","Is it your pet rabbit?"],correct:2},
        {q:"Nicole: ___ Angela: They are toys from my friends.",options:["What's this?","Who is that boy?","What about the toys?","What are these?"],correct:3},
        {q:"Jacob: ___ Elisa: No, they are Tom's pets.",options:["Are those your pets?","What are these?","Are they pets?","Who are they?"],correct:0}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"The fat cat is Roger's pet.",hint:"（改為疑問句）",answer:"Is the fat cat Roger's pet?"},
        {prompt:"Is our dad Amy's uncle?",hint:"（先肯定簡答再詳答）",answer:"Yes, he is. He is her uncle."},
        {prompt:"Those young men's noses are big.",hint:"（將those改為that並改寫句子）",answer:"That young man's nose is big."},
        {prompt:"The boy in the picture is my son.",hint:"（依畫線部分造原問句）",answer:"Who is the boy in the picture?"},
        {prompt:"The child in the picture is tall and cute.",hint:"（將畫線部分改為複數並改寫句子）",answer:"The children in the picture are tall and cute."}
      ]
    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[
        {zh:"Joe 的媽媽是一位醫生，不是護理師。",answer:"Joe's mother is a doctor, not a nurse."},
        {zh:"你的生肖是什麼？你屬老鼠嗎？",answer:"What's your (Chinese zodiac) animal sign? Are you a rat?"},
        {zh:"Tom 是一個聰明且充滿活力的男孩。",answer:"Tom is a smart and energetic boy."},
        {zh:"我弟弟不是國中生。他是高中生。",answer:"My brother isn't a junior high school student. He's a senior high school student."},
        {zh:"A：電影院裡的那些人是誰？B：他們是 Flora 的家人。",answer:"A: Who are those people in the movie theater? B: They are Flora's family."}
      ]
    },
    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Dear Oscar,\nMy name is Vicky. I am from Australia. I ___1___ a teacher. I'm a student. Here is a picture of my family. The tall boy is my brother. He is a ___2___, too. The beautiful woman ___3___ my sister. She is my mother. She looks young, right? In people's eyes, we aren't like mother and daughter. We are like ___4___. The handsome man is my dad. He is a nice person. Hardy is our pet. It is a cute cat. ___5___ your family? Show me your picture!\nVicky",
      items:[
        {options:["am not","am","isn't","are"],correct:0},
        {options:["student","teacher","farmer","doctor"],correct:0},
        {options:["is","isn't","are","aren't"],correct:1},
        {options:["brothers","father and son","sisters","husband and wife"],correct:2},
        {options:["How old","What","Who","What about"],correct:3}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】",
          text:"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\"><div style=\"border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;background:#fff;\">“I'm Prince George. I'm from the UK.”</div><div style=\"border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;background:#fff;\">“I'm Prince William. I'm Prince George's father. My wife is Kate Middleton. My wife is a great photographer.”</div><div style=\"border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;background:#fff;\">“I'm Princess Charlotte. I'm Prince George's sister. My grandfather is King Charles. My grandmother is Diana Spencer.”</div><div style=\"border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;background:#fff;\">“I'm Meghan Markle. My husband is Prince Harry. He is Prince William's brother.”</div></div>",
          items:[
            {q:"Who is Prince George's aunt?",options:["Diana Spencer.","Kate Middleton.","Princess Charlotte.","Meghan Markle."],correct:3},
            {q:"What is true about King Charles?",options:["He is Prince Harry's grandfather.","He is a great photographer.","He is Prince William's father.","He is Prince George's uncle."],correct:2}
          ]
        },
        {
          label:"【B】KS NEWS　2016.08.08",
          text:"The koalas at Taipei Zoo are cute. They are from Australia, and eucalyptus trees are their homes in Taiwan. Patrick is the father of the big family. His wives are Ligi, Empress, and Emily. They are beautiful koalas. Q-be is Patrick and Ligi's son. Q-di is Patrick and Ligi's son, too. He is Q-be's brother. Patrick and his wives are nice to their sons.\nPatrick and Empress' daughter is Q-mei. She is beautiful. Patrick and Emily's daughter is Q-zai. She is beautiful, too. Patrick and his wives are their daughters' friends.\nPatrick is also two koalas' grandfather. Nicole is Q-be's daughter. Her mother is Tiwi. Coffee Pie is Q-di's daughter. Her mother is Coral. The koala family at Taipei Zoo is happy.",
          items:[
            {q:"Who is Coffee Pie's uncle?",options:["Patrick.","Q-mei.","Q-be.","Coral."],correct:2},
            {q:"Who is Patrick?",options:["He is Q-be and Q-di's brother.","He is Emily's husband.","He is Q-mei's grandfather.","He is Empress' son."],correct:1},
            {q:"Which is NOT true?",options:["Patrick and his wives are from Australia.","Patrick's daughters are Nicole and Tiwi.","Coral's daughter is Coffee Pie.","Q-zai is a beautiful koala."],correct:1}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
