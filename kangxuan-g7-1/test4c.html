<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第4回 - Review 1（二）（C卷）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g7-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第4回・Review 1（二）</h1>
    <p class="subtitle">Review 1（二）｜康軒版七年級英語（一）Ｃ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g7-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "C卷", examLabel: "第4回" };
const DATA = {
  sections: [
    {
      type:"mc",
      title:"第一部分",
      meta:"題號1~20，請依據題意選出一個正確或最佳的答案。每題2分，共40分",
      items:[
        {q:"Mr. and Mrs. Chang are ___. They grow（種植）apples.",options:["doctors","nurses","farmers","cooks"],correct:2},
        {q:"The sheep ___ cute. Are they your uncle's sheep?",options:["are","am","is","isn't"],correct:0},
        {q:"A: My parents are doctors. ___ your parents? B: My mother is a teacher, and my father is a cook.",options:["Who are","What about","How old","How are"],correct:1},
        {q:"A: Is ___? B: Yes, he is great!",options:["the good nurse","Sam a good nurse","he good a nurse","your nurse a friend"],correct:1},
        {q:"George is a ___. His dishes（菜肴）are great.",options:["teacher","cook","nurse","doctor"],correct:1},
        {q:"These books are Lisa's gifts（禮物）. They are from ___ parents and friends.",options:["their","his","its","her"],correct:3},
        {q:"A: Are those Sam's robots? B: No, they're ___ robots.",options:["these boy's","those girls'","that boys'","that girl"],correct:1},
        {q:"Kate is tall and ___. Many（許多的）boys in my school like her.",options:["same","cute","true","different"],correct:1},
        {q:"Joe is my ___. He is Uncle Curry's son.",options:["aunt","rat","cousin","pet"],correct:2},
        {q:"A: Is she Miss Smith? B: Yes, she is ___ English teacher.",options:["a","my","×","the"],correct:1},
        {q:"A: ___ Ann's and Susie's husbands great friends? B: Yes, ___.",options:["Is; he is","Are; they are","Is; he's","Are; they're"],correct:1},
        {q:"Mrs. Doug's kitchen（廚房）is big ___ great. I like it.",options:["too","and","from","to"],correct:1},
        {q:"___ my dog. ___ name is Lucky.",options:["It's; It's","Its; It's","Its; Its","It's; Its"],correct:3},
        {q:"A: Are they your ___? B: Yes, they are my mom and dad.",options:["uncles","cousins","parents","aunts"],correct:2},
        {q:"Nick and Alice are ___ and wife. They have a son and a daughter.",options:["animal","woman","family","husband"],correct:3},
        {q:"This is a ___ school. All（全部）the students in it are boys.",options:["boy","boy's","boys","boys'"],correct:3},
        {q:"A: Is ___ rat stupid（笨的）? B: No, it isn't. It's a smart rat.",options:["that","it","these","those"],correct:0},
        {q:"Those girls are beautiful. They are my uncles' ___.",options:["brothers","daughters","sons","parents"],correct:1},
        {q:"A: What's that? Is it a(n) ___? B: Yes. It's heavy（重的）, and its ears are big.",options:["snake","elephant","zebra","mouse"],correct:1},
        {q:"A: ___ is this young man? B: He is my PE teacher.",options:["Where","How","Who","How old"],correct:2}
      ]
    },
    {
      type:"reading",
      title:"第二部分",
      meta:"題號21~40，四個題組，請依據所附選文或圖表資料，選出一個正確或最佳的答案。每題3分，共60分",
      passages:[
        {
          label:"【21～25】",
          text:"Oscar: Good morning, Stella.\nStella: Good morning, Oscar.\nOscar: This ___21___ for you. Open it.\nStella: Wow, it's a hat. I like it. Thanks!\nOscar: You're welcome.\nStella: Oh, by the way, ___22___ that tall boy?\nOscar: He is an exchange student in my class. ___23___ name is Jacob. He is ___24___ Australia（澳洲）.\nStella: How is he?\nOscar: He is ___25___, and he is popular in my class.\nStella: That's great.",
          items:[
            {q:"21.",options:["are","is","am","be"],correct:1},
            {q:"22.",options:["what is","what are","who is","who are"],correct:2},
            {q:"23.",options:["His","My","Her","Its"],correct:0},
            {q:"24.",options:["on","to","from","in"],correct:2},
            {q:"25.",options:["nice person","nice a person","a nice person","a person nice"],correct:2}
          ]
        },
        {
          label:"【26～30】",
          text:"My name is Kiki. I am a 70-year-old dwarf. I'm short, and my nose is big. I have four brothers. They are Sneezy, Doc, Dopey, and Sleepy. They are old and short dwarves, too. And their noses are also big. My brothers and I have different talents. I am a good cook. Sneezy is a farmer. Doc is a doctor. Dopey is an actor. And Sleepy is a teacher.\nWe have a good friend, Lisa. She is different from us. She is tall and young, and her nose is small. That's interesting, right?",
          items:[
            {q:"26. How old is Kiki?",options:["He is seven years old.","He is seventeen years old.","He is seventy years old.","He is seventy-seven years old."],correct:2},
            {q:"27. How is Dopey's nose?",options:["It's big.","It's small.","It's good.","It's short."],correct:0},
            {q:"28. Who is a doctor?",options:["Kiki.","Sneezy.","Doc.","Sleepy."],correct:2},
            {q:"29. Who is NOT a dwarf?",options:["Sneezy.","Doc.","Dopey.","Lisa."],correct:3},
            {q:"30. Which is true?",options:["Lisa is an old woman.","Sleepy is a young dwarf.","Kiki and Doc are brothers.","Sneezy and Lisa are husband and wife."],correct:2}
          ]
        },
        {
          label:"【31～35】",
          text:"Hello, I'm Ashley. I'm 40 years old. I am a nurse. I am from Taiwan. I have a great husband and a cute son.\nMy name is David. I'm a 45-year-old teacher. I am from Japan（日本）. I'm Ashley's husband.\nHi, my name is Linda. I'm 35 years old. I'm a cook. Ashley is my sister.\nGood morning, I'm Toby. I am a junior high school student. I live with my parents, Ashley and David.",
          items:[
            {q:"31. Who is a student?",options:["David.","Linda.","Toby.","Ashley."],correct:2},
            {q:"32. Which is true?",options:["Linda is Toby's aunt.","David is Linda's brother.","Ashley is from Japan.","Toby is twenty years old."],correct:0},
            {q:"33. Who is a nurse?",options:["Linda.","Ashley.","David.","Toby."],correct:1},
            {q:"34. Who is thirty-five years old?",options:["Toby.","Ashley.","Linda.","David."],correct:2},
            {q:"35. Which is true about David?",options:["He is a cook.","He is Toby's uncle.","He is Linda's husband.","He is a teacher."],correct:3}
          ]
        },
        {
          label:"【36～40】",
          text:"Hi, Daisy,\nHow are you in Australia（澳洲）? I'm good in Japan（日本）.\nEmily and Josh are my friends. They are twins, but they are different. Emily is tall and thin. Cats and rabbits are her favorite animals. And Hello Kitty is her favorite cat's name. Josh is short and fat. Robots are his favorite toys. Doraemon is his favorite robot cat. They are different, right?\nEmily and Josh are from Canada（加拿大）. They study here in Japan. They are my good friends in Japan.\nKevin",
          items:[
            {q:"36. Who is thin and tall?",options:["Daisy.","Emily.","Josh.","Kevin."],correct:1},
            {q:"37. Where is Josh from?",options:["Canada.","Japan.","Taiwan.","Australia."],correct:0},
            {q:"38. What is “Doraemon”?",options:["A dog.","A robot.","A child.","A tiger."],correct:1},
            {q:"39. Who is NOT in Japan now?",options:["Kevin.","Josh.","Emily.","Daisy."],correct:3},
            {q:"40. Which is true?",options:["Daisy is in Canada.","Emily is young, but Josh is old.","Daisy and Kevin study in Japan.","Emily and Josh are brother and sister."],correct:3}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
