<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第10回 - Lesson 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g7-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第10回・Lesson 6</h1>
    <p class="subtitle">Are There Any Shelves Outside the Door?｜康軒版七年級英語（一）Ａ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g7-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第10回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"There are a lot of students reading in the school l___y. Please don't make any noise.", answer:"library"},
        {q:"Gina: Where is your pet dog? Ellie: It's playing with a ball in the g___n behind my house.", answer:"garden"},
        {q:"Ivan: What is the m___g of this sign? Tim: That's a good question. Let's ask（詢問）Mr. Lin.", answer:"meaning"},
        {q:"Sindy: Dad, I'm h___y. Dad: You can eat some sandwiches.", answer:"hungry"},
        {q:"Rina and her friends are playing on the swings in the p___d.", answer:"playground"},
        {q:"Billy's parents are standing in front of the school. They're waiting for their son at the school g___e.", answer:"gate"},
        {q:"Danny: Can we take a r___t? I'm tired（疲累的）. Nick: OK. Let's sit down here.", answer:"rest"},
        {q:"Olivia: What is there in the b___t on the table? Lily: There are some apples in it.", answer:"basket"},
        {q:"Judy and I are in the same class. We are c___es.", answer:"classmates"},
        {q:"Simon: Let's go to the gym and w___k out after school. Hank: That's a great idea!", answer:"work"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Eddie: Is there a basketball court at your school? Sue: Yes, ___. The basketball court is big.",options:["they are","these are","there is","that is"],correct:2},
        {q:"Daughter: Can I eat the sandwich on the table? Mom: No, it's ___ lunch. You can only eat the apple beside the sandwich now.",options:["on","with","for","about"],correct:2},
        {q:"Rita: Is there a wallaby（沙袋鼠）at Taipei Zoo? Ben: No, ___ a wallaby at Taipei Zoo.",options:["there isn't","there aren't","that is","those are"],correct:0},
        {q:"Dad: How are you doing at your new school? Son: Great. Don't worry ___ me.",options:["at","with","from","about"],correct:3},
        {q:"Zoe and Vivian are my good friends. They are very nice ___ me.",options:["at","to","with","for"],correct:1},
        {q:"Dan: It's 9:00 at night. Are there any students at your school? Ann: Yes, ___. They are good students.",options:["there are","those are","that is","this is"],correct:0},
        {q:"Ethan: ___ a lot of sheep at the zoo. Sara: Yes. Sheep are cute animals.",options:["There is","There are","That is","These are"],correct:1},
        {q:"Doris: There are ___ flowers（花）in the garden. Gina: They're beautiful. I like them.",options:["any","lots of","very","too"],correct:1},
        {q:"Peter: Please look ___ this photo. Owen: Wow, it's cool.",options:["to","for","on","at"],correct:3},
        {q:"Son: Are there ___ mountains（山）in Taiwan? Mom: Yes, Mt. Jade, Mt. Ali, Mt. Yangming...",options:["a lot","these","any","those"],correct:2},
        {q:"Emily: Who is standing near the traffic lights? Ivan: Miss Lin, and ___ a cat sitting next to her.",options:["there is","this is","there are","they are"],correct:0},
        {q:"Hey, don't be shy（害羞的）. Say hello ___ your new classmates.",options:["with","about","to","from"],correct:2}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Cindy: Where are you going? The gym is this way. Betty: Oh, thanks. ___",options:["They are very nice to me.","I'm still finding my feet.","It's time for lunch.","I'm thinking about you all the time."],correct:1},
        {q:"Tina: Are there any blankets in your bedroom? Ryan: No, ___.",options:["there are some blankets in my bedroom","those blankets are in front of my bed","these are not your blankets","there aren't any blankets in my bedroom"],correct:3},
        {q:"Sherry: ___ Chris: Where is my pen? I can't find it anywhere.",options:["Are there any pens on your table?","Where can I put my pen?","What are you looking for?","What is that on your table?"],correct:2}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"Is there a special picture on the table?",hint:"（肯定詳答）",answer:"Yes, there is a special picture on the table."},
        {prompt:"No, there isn't a dining room near the kitchen.",hint:"（依畫線部分造原問句）",answer:"Is there a dining room near the kitchen?"},
        {prompt:"There are some people in the park.",hint:"（(1)用not改為否定：2分；(2)用no改為否定：1分）",answer:"(1) There are not any people in the park.　(2) There are no people in the park."},
        {prompt:"Are there any students in the PE class?",hint:"（用「很多學生」回答）",answer:"Yes, there are a lot of students in the PE class."},
        {prompt:"Are there any sports fields in the park?",hint:"（否定詳答）",answer:"No, there aren't any / are no sports fields in the park."}
      ]
    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[
        {zh:"大門後面有六座籃球場和兩棟圖書館。",answer:"There are six basketball courts and two libraries behind the gate."},
        {zh:"教室裡面沒有任何老師在。",answer:"There aren't any teachers in the classroom."},
        {zh:"鞦韆底下有一隻兔子嗎？",answer:"Is there a rabbit under the swing?"},
        {zh:"許多來自美國的學生正站在體育館前面。",answer:"A lot of students from the USA are standing in front of the gym."},
        {zh:"花園裡有一個籃子。",answer:"There is a basket in the garden."}
      ]
    },
    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Hey Dad,\nHow are you doing ___1___ the USA? I'm in Taitung now. ___2___ lots of people in the green fields. They are very happy today, and they are here to see the hot air balloons. Those hot air balloons are beautiful and special. There are ___3___ mountains next to the green fields. ___4___ mountains are green and beautiful. There are some trees and animals in the mountains. The trees are tall, and the animals are cute.\nI like Taitung very much. Come to Taitung with me next time, and I can show you ___5___!\nRon",
      items:[
        {options:["with","in","from","about"],correct:1},
        {options:["There is","There are","Those aren't","That is"],correct:1},
        {options:["any","no","a lot of","a"],correct:2},
        {options:["There","That","This","Those"],correct:3},
        {options:["around","from","about","on"],correct:0}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】",
          text:"There is a man sitting under the tree. He is Mr. Eagle. His name is Shen Cheng-chung, and he is a great teacher.\nThere are some eagles in the tree, and some sparrows are eating things on the ground next to Mr. Eagle.\nHowever, there aren't a lot of eagles in Taiwan now. Eagles like to eat sparrows, but there is a lot of pesticide in them. The eagles eat them, and there is a lot of pesticide in the eagles, too. Mr. Eagle is worried about that. A lot of people around Taiwan are worried about that, too. Let's be eagles' friends and protect them together!",
          items:[
            {q:"What is there in the tree?",options:["Mr. Eagle.","Eagles.","Sparrows.","Pesticide."],correct:1},
            {q:"What is true?",options:["There is a man standing under the tree.","Sparrows like to eat eagles.","No one is worried about the eagles in Taiwan.","There are some sparrows near Shen Cheng-chung."],correct:3}
          ]
        },
        {
          label:"【B】",
          text:"Bob: What's that big building? It's new.\nGina: That's Happy Mall. Let's go inside.\nBob: OK. Look! There are mountains of bananas and oranges here. It's very special!\nGina: Haha! It's not special in Taiwan. In fact, there are a lot of malls like this.\nBob: That's cool. I like Happy Mall.\nGina: I like it, too. There are a lot of things in Happy Mall. There are apples, oranges, cakes, T-shirts, and smartphones. And those things are not expensive.\nBob: Is Happy Mall open only at night?\nGina: No, it is open from 11:00 to 22:00.\nBob: The mall is very big. Let's go around!\nGina: Hey, don't run! There are boxes around. Watch out! There is a big box behind you.\nBob: Ouch! Thank you. I'm good now. The place is big. However, there are a lot of boxes around. It's like an old house.\nGina: For me, it is still a great place. I have a lot of fun at Happy Mall.",
          items:[
            {q:"Where are Bob and Gina?",options:["In the mountains.","In a big box.","In an old house.","In a mall."],correct:3},
            {q:"What time can people go to Happy Mall?",options:["At 11 a.m.","At 8 a.m.","At 11 p.m.","At 6 a.m."],correct:0},
            {q:"What is NOT true?",options:["There are a lot of things in Happy Mall.","There are a lot of boxes in Happy Mall.","Happy Mall is open only at night.","Things in Happy Mall are not expensive."],correct:2}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
