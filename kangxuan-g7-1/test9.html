<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第9回 - Lesson 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g7-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第9回・Lesson 5</h1>
    <p class="subtitle">What Are You Doing?｜康軒版七年級英語（一）Ａ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g7-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第9回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"Everyone, come here. Let's take a g___p photo with our teachers.", answer:"group"},
        {q:"Tracy: What time is the welcome party for Eric? Noah: It's from n___n to 2:30 p.m.", answer:"noon"},
        {q:"The teachers are in the m___g now. They're talking about the problems between the students.", answer:"meeting"},
        {q:"The school is closed（關閉的）on Saturdays and Sundays. Don't go there on w___ds.", answer:"weekends"},
        {q:"Don't c___t with your friends here. Please be quiet in the school library（圖書館）.", answer:"chat"},
        {q:"Victor: What's for d___r tonight? Zoe: Let's not eat at home. Let's go out and have some hot dogs.", answer:"dinner"},
        {q:"Don't make any noise. Your brother is p___ring for the English test（考試）.", answer:"preparing"},
        {q:"A: Is it Thursday today? B: No, it's W___y today. Tomorrow（明天）is Thursday.", answer:"Wednesday"},
        {q:"Ted and Rita's new house is in Taipei. They like the c___y life there.", answer:"city"},
        {q:"Will: Can you play basketball? Come and j___n us! Sid: OK. I like basketball.", answer:"join"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Will: What ___ is it? I want to go to bed now. Alice: It's only 7 p.m. Are you OK?",options:["time","day","week","year"],correct:0},
        {q:"Hank is hungry（飢餓的）. Look! He ___ eggs in the dining room now.",options:["is eating","are eating","eating","eat"],correct:0},
        {q:"Billy: Is it time ___ English class now? Eva: Yes. Please be quiet and don't make any noise.",options:["to","for","with","about"],correct:1},
        {q:"Linda: Is it 7:20 now? Fred: Yes. ___ up. We are late for school.",options:["Hurrying","Is hurrying","Are hurrying","Hurry"],correct:3},
        {q:"David: ___ are you doing now? Jane: I'm watching TV in the living room.",options:["What","How","Where","Who"],correct:0},
        {q:"The basketball game is ___ two o'clock ___ Sunday.",options:["at; ×","at; on","on; ×","on; at"],correct:1},
        {q:"It's twelve ___. Let's have lunch in the dining room.",options:["o'clock","o'clocks","clock","clocks"],correct:0},
        {q:"Don: Is your group chat ___ Monday? Celia: Yes, it is. I am preparing for it.",options:["at","on","in","with"],correct:1},
        {q:"Some people are standing on the sidewalk. They ___ for the bus.",options:["wait","is waiting","are waiting","waiting"],correct:2},
        {q:"Stan: Is Doctor Lee in a meeting? Ian: Yes. It's a meeting ___ some young doctors.",options:["with","to","from","×"],correct:0},
        {q:"Benita: Are you looking ___ your watch? Andrea: Yes. I lost（遺失）it this morning.",options:["for","with","at","from"],correct:0},
        {q:"It's 9:00 p.m. Everyone in my class ___ homework（功課）now.",options:["do","doing","are doing","is doing"],correct:3}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Chanel: ___ Gabriel: It's about our life in Taiwan.",options:["What about your life?","What's the group chat about?","Where are your parents from?","Is it about six o'clock in Taiwan now?"],correct:1},
        {q:"Kim: My sons go to bed early every day. Vic: ___ No wonder they're energetic.",options:["It's on Sunday!","Let's say good morning!","Hurry up! You're late!","That's great!"],correct:3},
        {q:"Roger: I'm at school now. Oh, by the way, ___ Tina: What time is your meeting? Roger: It's at nine.",options:["what are you doing in the meeting?","I have a meeting tonight.","I have a meeting at nine o'clock.","it's 12, and I'm in a meeting now."],correct:1}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"Everyone is listening to me.",hint:"（依畫線部分造原問句）",answer:"What is everyone doing?"},
        {prompt:"It's nine in the evening.",hint:"（依畫線部分造原問句）",answer:"What time is it (now)?"},
        {prompt:"She is running in the park with her friend.",hint:"（改為複數句）",answer:"They are running in the park with their friends."},
        {prompt:"eating / Peter / with / is / lunch / his brother.",hint:"（重組句子）",answer:"Peter is eating lunch with his brother."},
        {prompt:"Are your parents saying goodbye?",hint:"（否定詳答）",answer:"No, they aren't saying goodbye."}
      ]
    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[
        {zh:"順帶一提，我們正在為他準備晚餐。",answer:"By the way, we are preparing dinner for him."},
        {zh:"他們正在尋找那些來自美國的學生。",answer:"They are looking for those students from the USA."},
        {zh:"他正在和我談論今晚的會議。",answer:"He is talking to me about the meeting tonight."},
        {zh:"這個團體談話是關於我們在那座美麗城市的生活。",answer:"The group chat is about our life in that beautiful city."},
        {zh:"今天是星期五。我班上的每個人都正在教室裡閱讀。",answer:"It's Friday. Everyone in my class is reading in the classroom."}
      ]
    },
    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Mike: Look! Everyone ___1___ juice with a paper straw there.\nDora: You're right. Paper straws are different from plastic straws. Hey, look at this picture on my smartphone.\nMike: ___2___ is it from?\nDora: It is from the news today. Look at the turtle.\nMike: Oh, no! The plastic straw is in the turtle's nose. The turtle is not happy. This is not good for its ___3___.\nDora: Yes. Plastic straws are bad for animals.\nMike: They are bad for us and the world, too. Let's not drink with plastic straws next time.\nDora: OK. Look! Those people ___4___ cold milk without straws.\nMike: Wow! That's good for the world.\nDora: True. Let's ___5___ friends with the world.",
      items:[
        {options:["drink","drinking","is drinking","are drinking"],correct:2},
        {options:["What day","Where","Who","What"],correct:1},
        {options:["tonight","clock","time","life"],correct:3},
        {options:["are having","is having","having","to have"],correct:0},
        {options:["be","being","am","are"],correct:0}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】Riddle",
          text:"Hint 1: It is like a horse.\nHint 2: There are black and white lines on it.\nHint 3: It is running on the grassland.\nHint 4: It is an animal.",
          items:[
            {q:"What is it?",options:["A monkey.","A zebra.","A tiger.","A sheep."],correct:1},
            {q:"A girl is thinking about a “riddle.” What is she doing?",options:["She is thinking about a special question.","She is thinking about her birthday party.","She is running on the grassland.","She is making noise."],correct:0}
          ]
        },
        {
          label:"【B】",
          text:"Here we are in Tamsui, Taipei. People are sitting on their chairs and waiting for tonight's show in the theater. The show is at seven thirty.\nLook! Lin Hwai-min is standing in front of those people. He is a great choreographer from Taiwan. His students and friends are standing behind him. They are listening to him talking about the ways of making beautiful dances.\nIt is seven thirty now. Lin Hwai-min is dancing with his students. The show is special and beautiful, and people at the show are having great fun. But they aren't shouting their favorite choreographer's name. Today is a big day, and everyone is very quiet.\nIn fact, this is Lin Hwai-min's last show. He is very sad. Dancing is his life, but it's time for retirement. These people are here to see his show for the last time. Let's watch his show now.",
          items:[
            {q:"What is a “choreographer's” job?",options:["Standing up and shouting at a show.","Playing with friends and students.","Making beautiful dances for shows.","Talking to people about retirement."],correct:2},
            {q:"What are people doing at Lin Hwai-min's last show?",options:["They are chatting and making a lot of noise.","They are shouting Lin Hwai-min's name.","They are eating and drinking on their chairs.","They are watching Lin Hwai-min dancing."],correct:3},
            {q:"Which is NOT true about Lin Hwai-min and his show tonight?",options:["He is a great choreographer from Taiwan.","His students are dancing with him at seven thirty.","This is his last show, and he is sad.","His show is very sad, and people are not having fun."],correct:3}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
