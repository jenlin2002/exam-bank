<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第2回 - Lesson 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}
  .data-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;background:#fff;}
  .data-table th, .data-table td{border:1px solid var(--paper-line);padding:6px 8px;text-align:center;}
  .data-table th{background:#eef3ea;color:var(--chalk-green);}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g8-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第2回・Lesson 2</h1>
    <p class="subtitle">Why Didn't You See a Doctor?｜康軒版八年級英語（三）Ａ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">

    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g8-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第2回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"Dr. Wang is our family doctor. He takes care of our h___h.", answer:"health"},
        {q:"Mindy didn't go to school yesterday because she c___t a cold. She rested at home all day.", answer:"caught"},
        {q:"Never exercise on a full（滿的）s___h. That isn't good for your body.", answer:"stomach"},
        {q:"I have a bad sore t___t. It hurts a lot when I eat or talk. I need to see a doctor.", answer:"throat"},
        {q:"This table is too heavy. I'm not s___g enough to move it. Can you help me?", answer:"strong"},
        {q:"Didn't Dr. Hung tell（告訴）you to take the m___e three times a day? You must follow it!", answer:"medicine"},
        {q:"We don't need any heavy c___ts for our trip（旅行）to Australia. It's summer, and it's very hot.", answer:"coats"},
        {q:"Nick and Mike come from different c___ries. Nick is from Taiwan, and Mike is from Singapore.", answer:"countries"},
        {q:"Jacob got a s___s illness（疾病）last week. He stayed at home and couldn't go to work for a week.", answer:"serious"},
        {q:"Drew: Mr. Smith didn't answer my call. Ivan: Maybe we can send him a m___e.", answer:"message"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Hazel: ___ you work for Bob then? John: Because he wasn't nice to me.",options:["How do","What do","How don't","Why didn't"],correct:3},
        {q:"Terry's mom bought a new computer ___ him. He was very happy.",options:["to","for","of","from"],correct:1},
        {q:"Kevin seldom goes to the beach ___ he can't swim, and he doesn't enjoy the sun.",options:["because","because of","so","but"],correct:0},
        {q:"We didn't go camping ___ the heavy rain. The weather was bad last weekend.",options:["because","because of","so","as for"],correct:1},
        {q:"Your banana pancake is delicious. Can you ___ one for my son, too, please?",options:["give","show","send","make"],correct:3},
        {q:"Both my brothers play badminton in their free time. ___ me, tennis is my favorite（最喜歡的）sport.",options:["However","Around","Maybe","As for"],correct:3},
        {q:"Al is a good friend of ___. We studied in the same school before, and we work in the same place now.",options:["me","my","mine","I"],correct:2},
        {q:"Little Johnny is writing a letter ___ Santa Claus. He wants to get a special gift（禮物）from him.",options:["for","off","to","in"],correct:2},
        {q:"We can make dinner at home ___ go to a great restaurant. What do you say?",options:["but","or","so","because"],correct:1},
        {q:"Some people around the world eat ice cream ___ a sore throat, but people in Taiwan don't.",options:["with","to","for","of"],correct:2},
        {q:"___ Kurt didn't prepare for the English test, ___ he only got a forty-nine.",options:["Because; so","So; because","Because; ×","So; ×"],correct:2},
        {q:"Dolly, this toy car is for Justin, not for you. Please be a good girl and give ___.",options:["it to him","him it","him to it","to him it"],correct:0}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Tina: Can you come here and help me? Justin: Sure. ___",options:["What can I do for you?","But I really want to help you.","Why don't you see a doctor?","I can't because I'm very busy now."],correct:0},
        {q:"Arthur: Is our little boy crying in the room? ___ Maggie: He wanted a robot, but I said, \"No.\"",options:["I love it!","What happened?","Isn't he at school now?","How often does he do that?"],correct:1},
        {q:"Louis: ___ Gill: He's on the phone. Please call again later.",options:["Can we talk about it?","May I speak to Kevin?","Who are you talking to?","Why didn't Kevin talk to me?"],correct:1}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"Wade didn't say goodbye to Mom because he was in a hurry.",hint:"（依畫線部分造原問句：because he was in a hurry）",answer:"Why didn't Wade say goodbye to Mom?"},
        {prompt:"Mrs. Brown gave Kenny two movie tickets.",hint:"（用介系詞改寫句子）",answer:"Mrs. Brown gave two movie tickets to Kenny."},
        {prompt:"Tim had a stomachache because he ate too much.",hint:"（用 ... so... 改寫句子）",answer:"Tim ate too much, so he had a stomachache."},
        {prompt:"We didn't go camping because the weather was terrible.",hint:"（將because改為because of並改寫句子）",answer:"We didn't go camping because of the terrible weather."},
        {prompt:"Mike bought his wife a strawberry cake.",hint:"（將畫線部分用代名詞改寫句子：his wife）",answer:"Mike bought it for his wife."}
      ]
    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[
        {zh:"在你的國家你們如何治療感冒？",answer:"How do you treat a cold in your country?"},
        {zh:"Mary 總是喝冷飲，甚至在寒冷的冬日裡。",answer:"Mary always drinks cold drinks, even on cold winter days."},
        {zh:"你的想法跟Amy的是一樣的嗎？",answer:"Is your idea the same as Amy's?"},
        {zh:"Maggie 上週五帶了一些冰淇淋給她的學生們嗎？（以介系詞作答）",answer:"Did Maggie bring some ice cream to her students last Friday?"},
        {zh:"Leo 上週六發燒且在家睡了一整天。",answer:"Leo had a fever and slept at home all day last Saturday."}
      ]
    },
    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Hi, Cathy,\nHow are you in the USA? I just read a piece of news. It's the flu season in the USA, and over 10,000 people are dead. That's terrible. Please take good care of yourself.\nIn fact, ___1___. I went hiking with my friends. The weather was sunny in the morning. ___2___, it became cloudy in the afternoon and started to rain on my way home. I didn't have an umbrella with me, ___3___ I got all wet. I was so ___4___ then, but I'm fine now. Don't worry about me.\n___5___ warm,\nEmily\n\n【字詞】flu 流感　dead 死掉的　yourself 你自己　wet 溼的",
      items:[
        {options:["I broke my legs last week","I had a good time last week","I caught a bad cold last week","I stayed at home every day last week"],correct:2},
        {options:["However","So","Also","Because"],correct:0},
        {options:["because","because of","but","so"],correct:3},
        {options:["strong","healthy","heavy","sick"],correct:3},
        {options:["Treat","Bring","Keep","Try"],correct:2}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】",
          text:"(Grace is calling 911 for an emergency.)\nOperator: 911. What's your emergency?\nGrace: My son just got hurt!\nOperator: What's your location?\nGrace: No. 10 Moon Street. We are next to Art Museum.\nOperator: Got it. And what floor?\nGrace: We're on the fifth floor.\nOperator: We're sending our help now. How old is your son?\nGrace: He's three years old.\nOperator: Is he bleeding?\nGrace: Yes, from his head.\nOperator: Is he still conscious?\nGrace: No! He doesn't answer me.\nOperator: I see. Please don't move him.\nGrace: OK. Please come quickly!\nOperator: Help is on the way. They will be with you in just a minute.\n\n【字詞】emergency 緊急事件　operator 接線生　bleed 流血　conscious 有意識的　quickly 快地　will 將會",
          items:[
            {q:"What does \"location\" mean?",options:["The people.","The emergency.","The call.","The place."],correct:3},
            {q:"What do we know about Grace's son?",options:["He is a high school student.","He is in an art museum.","He is calling 911 for help.","He got hurt."],correct:3},
            {q:"Which is true?",options:["Grace's hand is bleeding.","Grace is on the 5th floor.","The operator can't send help to Grace.","The operator will go to Grace's house later."],correct:1}
          ]
        },
        {
          label:"【B】",
          text:"XXJ-3 Colds &amp; Flu　（Non-Drowsy）\nTo treat: ✓ fever　✓ sore throat　✓ runny nose　✓ headache\nCaution:\n＊ NOT for people under 18 years old.\n＊ Take one tablet after lunch and one after dinner.\n＊ Take it with warm water, NOT with tea or juice.\n（24 TABLETS）\n\n【字詞】flu 流感　non-drowsy 不嗜睡的　runny nose 流鼻水　caution 警告　tablet 藥片",
          items:[
            {q:"Who might need XXJ-3?",options:["Ben, a junior high school student, hurt his legs.","Ann, a 19-year-old student, hurt her finger.","Mr. Wu, a 25-year-old cook, got a cold.","Leo, a 10-year-old boy, has a fever and a headache."],correct:2},
            {q:"What do we know about XXJ-3?",options:["People need to take it twice a day.","People must take 3 tablets a day.","People can take it with tea or juice.","People can't sleep after they take it."],correct:0}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderTable(t){
  if(!t) return "";
  const headHtml = `<tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>`;
  const rowsHtml = t.rows.map(r=>`<tr>${r.map((c,ci)=>ci===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div style="font-weight:700;text-align:center;color:var(--chalk-green);margin-bottom:6px;">${t.title}</div>
    <table class="data-table"><thead>${headHtml}</thead><tbody>${rowsHtml}</tbody></table>
    ${t.note ? `<div style="margin-top:8px;color:var(--ink-soft);font-size:13px;">${t.note}</div>` : ""}`;
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `${p.label ? `<span class="passage-label">${p.label}</span>`:""}${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}${p.table ? renderTable(p.table) : ""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
