<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第5回 - Lesson 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}
  .data-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;background:#fff;}
  .data-table th, .data-table td{border:1px solid var(--paper-line);padding:6px 8px;text-align:center;}
  .data-table th{background:#eef3ea;color:var(--chalk-green);}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g8-1.html" style="color:#cfe0d1;">段考題庫</a></div>

<main>

  <a class="footer-link" href="../kangxuan-g8-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第5回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"Ms. Lin: Students, please keep quiet in the museum. Don't s___t or run. Students: OK, Ms. Lin.", answer:"shout"},
        {q:"Let's take a walk a___g the river after dinner. We can see many trees there.", answer:"along"},
        {q:"Isaac can't r___h the glass on the table because he isn't tall enough.", answer:"reach"},
        {q:"The bird f___w away when we got close to it. I only took one picture of it.", answer:"flew"},
        {q:"Una's three-year-old son can write his name now. She's very p___d of him.", answer:"proud"},
        {q:"James practiced every day and f___y won the race. We are all happy for him.", answer:"finally"},
        {q:"There are four people here. Cut（切）the pie into q___rs, and everyone can get one piece.", answer:"quarters"},
        {q:"Cynthia didn't f___h the running race because she hurt her leg. She was sad about it.", answer:"finish"},
        {q:"Mom: Apologize（道歉）to your sister now! She might get hurt! Ken: Sorry, Nina. I shouldn't throw the r___k to you.", answer:"rock"},
        {q:"Ida: Why are you under the table? What are you doing? Ben: I d___ped my key on the floor. Please help me find it.", answer:"dropped"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Students, it's ___. Let's take a break for 10 minutes. Please come back at 10:20.",options:["ten to ten","half past ten","twenty to ten","ten past ten"],correct:3},
        {q:"Dad ___ the flowers（花）in front of the house at four o'clock yesterday afternoon.",options:["waters","is watering","water","was watering"],correct:3},
        {q:"When I ___ home last night, Mom was doing the dishes, and Dad was mopping the floor.",options:["get","am getting","got","gets"],correct:2},
        {q:"Percy and May weren't late this morning. They got to the classroom ___ the class started.",options:["but","before","until","after"],correct:1},
        {q:"Joy: ___ Ken and his brother ___ then? Ed: They were reading books.",options:["How were; doing","What were; doing","What did; do","How did; do"],correct:1},
        {q:"Mrs. Lee checked the boy's homework ___ he finished it. He did a good job and made only one mistake（錯誤）.",options:["but","before","after","so"],correct:2},
        {q:"Mike ___ the game on his smartphone when his little brother started crying. He put down his phone and ran to him right away.",options:["played","plays","was playing","is playing"],correct:2},
        {q:"I was washing the bowls when Stephanie ___. She helped me wash the rest of them.",options:["goes to school","is talking to me","come to meet me","came to the kitchen"],correct:3},
        {q:"When Diana ___ a child, she ___ eating ice cream. But now, she doesn't like cold food.",options:["is; enjoying","is; enjoys","was; enjoyed","was; enjoying"],correct:2},
        {q:"There is a picture of the dog at the ___ of this book. It has long ears and big eyes.",options:["begin","begins","began","beginning"],correct:3},
        {q:"Bill: What was Nina doing ___? Tina: She was reading books.",options:["on weekends","now","at that time","next Friday"],correct:2},
        {q:"My sister was studying and ___ to music（音樂）when I ___ past her bedroom.",options:["listened; went","listening; went","listening; am going","listened; was going"],correct:1}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Leo: Mom, I won the running race! Mom: ___ I'm so happy! Let's buy your favorite（最喜愛的）strawberry cake tonight.",options:["Go back. Don't run to me.","Wow, you did a good job!","Finally, I made a cake for you.","As for me, I didn't enjoy the race."],correct:1},
        {q:"Emily: Were you in SK Building at 5 p.m.? Owen: Yes. ___ Emily: There was a shootout（槍戰）on the first floor there. Didn't you know that?",options:["How about you?","Why do you ask?","Who was with you?","What were you doing?"],correct:1},
        {q:"Andy: You didn't go to the sports field yesterday afternoon. ___ Ted: My family and I were having a birthday party for my brother.",options:["What a smart idea!","How can I help you?","What can we do now?","What were you doing then?"],correct:3}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"Look at the picture. What time is it?（圖片時鐘顯示 8:45）",hint:"（用...to...詳答）",answer:"It's a quarter / fifteen to nine."},
        {prompt:"My students were playing soccer on the sports field at 3 p.m.",hint:"（依畫線部分造原問句：were playing soccer）",answer:"What were your students doing on the sports field at 3 p.m.?"},
        {prompt:"Bob brushed his teeth before he went to bed.",hint:"（用Before...改寫句子）",answer:"Before Bob went to bed, he brushed his teeth."},
        {prompt:"Eva feels happy. Eva's son breaks his bad habits.",hint:"（用...when...合併句子並改為過去式）",answer:"Eva felt happy when her son broke his bad habits."},

    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[

        {zh:"Mia 撿起了罐子並把一些岩石放進去。",answer:"Mia picked up the jar and put some rocks into it."},
        {zh:"當 Noah 跑回教室時，他落下了他的筆。（When...）",answer:"When Noah ran back to the classroom, he dropped his pen(s)."},
        {zh:"這隻烏鴉來回地走了一小時。",answer:"The crow walked back and forth for an hour."},
        {zh:"那時是四點半，並且我在森林的中央。（... half...）",answer:"It was half past four then, and I was in the middle of the forest."}

    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Last weekend was our family weekend. My family planned to do ___1___ interesting. We didn't stay home but went camping in the beautiful mountains in the country. On the way to the mountains, we chatted and sang in the car. Everything was great, and everyone was happy. The sun ___2___ all the way to the mountains. However, ___3___ we were about to get there, it started to rain. Did the rain stop later that day? Well… the answer was no. It rained even more heavily. \"How about staying in a cabin here tonight? It's not a good day for camping today,\" my mom asked. \"Good idea! Why didn't I think ___4___ this?\" I answered. But guess what! There was not a cabin for us. They were all full, ___5___ we could only go home. What a day!\n\n【字詞】plan 計畫　interesting 有趣的　more heavily 更大量地　cabin 小木屋　full 滿的",
      items:[
        {options:["beginning","anything","something","top"],correct:2},
        {options:["shines","was shining","is shining","shine"],correct:1},
        {options:["because","so","when","until"],correct:2},
        {options:["at","with","about","of"],correct:3},
        {options:["so","because","after","before"],correct:0}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】",
          text:"Josh likes to take photos in his free time. Last week, he went to a park and took some pictures. Here is one of them.",
          image:"images/test5/park.png",
          items:[
            {q:"Which ISN'T true about the man and the woman?",options:["They were in a park.","They were under a tree.","They were eating.","They were sitting on chairs."],correct:3},
            {q:"Which is true about the picture?",options:["The birds in the tree were sleeping.","Josh took the picture at half past five.","The boy and his pet dog were taking a walk.","The water in the pond was clear, and there were fish in it."],correct:3}
          ]
        },
        {
          label:"【B】",
          text:"Dear Eric,\nI am looking for my water bottle. I put it on the dining table. Did you see it? By the way, I found a picture book under the chair. It must be yours. I put it on the bookcase in the living room.\nTeresa　11/2　10:00 p.m.\n\nDear Teresa,\nThanks! Great, I didn't lose the picture book! In fact, I borrowed it from Jack. And no, I didn't see your water bottle. Maybe Mom put it in the cupboard.\nEric　11/3　7:00 a.m.\n\nDear Eric and Teresa,\nSorry, Dad and I aren't free this weekend. Dad is busy these days and still needs to work this weekend. And I have to take care of Grandma at the hospital. Please take care of yourselves.\nMom　11/5　7:30 a.m.\n\n【字詞】bookcase 書櫃　borrow 借入　cupboard 櫥櫃　yourselves 你們自己",
          items:[
            {q:"What does \"it\"（畫線部分，指 Teresa 信中 \"I put it on the bookcase\" 中的 it）refer to?",options:["The chair.","The picture book.","The bookcase.","The water bottle."],correct:1},
            {q:"Where is Teresa's water bottle?",options:["On the dining table.","Under the chair.","On the bookcase.","We don't know."],correct:3},
            {q:"What can we learn from the notes?",options:["Teresa is Jack's sister.","Eric's dad lost his job.","Teresa's mom got hurt.","Eric's grandma is sick."],correct:3}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderTable(t){
  if(!t) return "";
  const headHtml = `<tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>`;
  const rowsHtml = t.rows.map(r=>`<tr>${r.map((c,ci)=>ci===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div style="font-weight:700;text-align:center;color:var(--chalk-green);margin-bottom:6px;">${t.title}</div>
    <table class="data-table"><thead>${headHtml}</thead><tbody>${rowsHtml}</tbody></table>
    ${t.note ? `<div style="margin-top:8px;color:var(--ink-soft);font-size:13px;">${t.note}</div>` : ""}`;
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `${p.label ? `<span class="passage-label">${p.label}</span>`:""}${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}${p.table ? renderTable(p.table) : ""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
