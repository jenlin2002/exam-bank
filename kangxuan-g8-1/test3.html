<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第3回 - Review 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}
  .data-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;background:#fff;}
  .data-table th, .data-table td{border:1px solid var(--paper-line);padding:6px 8px;text-align:center;}
  .data-table th{background:#eef3ea;color:var(--chalk-green);}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g8-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第3回・Review 1</h1>
    <p class="subtitle">Lesson 1~2 總複習｜康軒版八年級英語（三）Ａ卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g8-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "A卷", examLabel: "第3回" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "20分，每題2分",
      items: [
        {q:"My little brother's s___h hurt a lot. He ate too much for dinner.", answer:"stomach"},
        {q:"Don't be a___d. The little lion is cute. Come and take a picture of it.", answer:"afraid"},
        {q:"Sophia didn't go to work yesterday because she c___t a cold.", answer:"caught"},
        {q:"It's r___ning outside. Remember（記得）to bring an umbrella with you.", answer:"raining"},
        {q:"Paul's wife wasn't happy because Paul f___t to buy her a birthday gift yesterday.", answer:"forgot"},
        {q:"Hank: Why are you wearing a face m___k? Wendy: I might be sick. My head really hurts.", answer:"mask"},
        {q:"Mr. Chen went to many different c___ries last year, like the USA, the UK, and Japan.", answer:"countries"},
        {q:"I had a terrible h___e last night, so I couldn't sleep all night. I really need to go to the doctor.", answer:"headache"},
        {q:"Why don't you turn on（打開）the light? It's so d___k in the room!", answer:"dark"},
        {q:"Ron: What's the book about? Sindy: It's about n___e. It talks about different kinds of trees.", answer:"nature"}
      ]
    },
    {
      type:"mc",
      title:"二、語法測驗",
      meta:"24分，每題2分",
      items:[
        {q:"Bob bought ___ for my birthday. It is about some great hiking experiences（經歷）.",options:["a book to me","to me a book","a book for me","for me a book"],correct:2},
        {q:"I forgot to set my alarm（鬧鐘）, ___ I was late for work.",options:["because","because of","so","but"],correct:2},
        {q:"Today is Teacher's Day. Let's write a card ___ Mr. Lin.",options:["×","for","from","to"],correct:3},
        {q:"Fred didn't go to school today ___ he was sick. He stayed in bed the whole（整個的）day.",options:["so","because","because of",", so"],correct:1},
        {q:"Pam: What are you doing, Tim? Tim: I'm ___ a coat ___ my mom.",options:["buying; to","giving; for","making; for","writing; to"],correct:2},
        {q:"Alice: ___ is the weather like in Hsinchu today? Betty: Windy but not cold.",options:["How","What","Why","Where"],correct:1},
        {q:"Sam: Why do you bring an umbrella? It's sunny now. Mandy: ___ a lot in Yilan. There might be rain in the afternoon.",options:["We have rain","It rains","There is rain","It's rainy"],correct:1},
        {q:"Allen: ___ are you crying? Betty: I left（遺留）my new watch on the bus! What should I do?",options:["Why","Who","How","What"],correct:0},
        {q:"Rita: How's the weather there in autumn? Ting: ___ is windy and sometimes rainy.",options:["It","That","This","There"],correct:0},
        {q:"My brother didn't eat his strawberry cake at the party. He brought it home and gave ___.",options:["me to it","to it me","it to me","to me it"],correct:2},
        {q:"My sister is afraid ___ mice, but I'm not.",options:["with","of","to","for"],correct:1},
        {q:"Matthew doesn't have a cold ___ feel sick. He just needs more sleep. Don't worry!",options:["or","and","so","because"],correct:0}
      ]
    },
    {
      type:"mc",
      title:"三、完成句子與對話",
      meta:"6分，每題2分",
      items:[
        {q:"Cindy: Good morning, Andy. ___ Andy: Not really. I'm under the weather. My head hurts a lot.",options:["What can I do for you?","Are you OK?","Did you see a doctor?","How's the weather?"],correct:1},
        {q:"Ron: May I speak to Nina, please? Nina: ___ Who is this?",options:["I'm calling you.","I called, but you didn't answer.","Sorry, she's not here.","This is Nina speaking."],correct:3},
        {q:"David: Why did Mike write a card to Mr. Brown? Jake: To show his thanks. ___",options:["Because of his help, Mike won the game.","At first, he was really afraid of him.","However, Mr. Brown didn't send it.","He practiced every day!"],correct:0}
      ]
    },
    {
      type:"guided",
      title:"四、依提示作答",
      meta:"15分，每題3分",
      items:[
        {prompt:"Ken needed some rest because he was sick.",hint:"（用 ... so... 改寫句子）",answer:"Ken was sick, so he needed some rest."},
        {prompt:"It was rainy yesterday.",hint:"（依畫線部分用What...造原問句：rainy）",answer:"What was the weather like yesterday?"},
        {prompt:"Why don't you send Mary the book?",hint:"（用介系詞改寫句子）",answer:"Why don't you send the book to Mary?"},
        {prompt:"I bought the boy some pie because it was his birthday.",hint:"（依畫線部分造原問句：because it was his birthday）",answer:"Why did you buy the boy some pie?"},
        {prompt:"We had a lot of snow in December.",hint:"（用There...開頭改寫）",answer:"There was a lot of snow in December."}
      ]
    },
    {
      type:"translation",
      title:"五、整句式翻譯",
      meta:"15分，每題3分",
      items:[
        {zh:"Tim 很強壯。他很少感冒。",answer:"Tim is strong. He seldom catches a cold."},
        {zh:"那些漁夫在大海附近建了一個城鎮。",answer:"Those fishermen built a town near the sea."},
        {zh:"我昨天沒去上學，因為我發燒了。",answer:"I didn't go to school yesterday because I had a fever."},
        {zh:"我的朋友上週寄了一盒冰淇淋給我。",answer:"My friend sent me a box of ice cream / a box of ice cream to me last week."},
        {zh:"你為什麼戴口罩？你身體不舒服嗎？",answer:"Why are you wearing a mask? Are you under the weather?"}
      ]
    },
    {
      type:"cloze",
      title:"六、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Ms. Wu: Morning, Peter. You didn't come to school yesterday. What happened?\nPeter: I didn't come ___1___. I caught a cold. I had a serious headache and a high fever.\nMs. Wu: Oh, that's too bad. ___2___ did you get sick?\nPeter: Well, it rained a lot on my way home the day before yesterday, but I didn't bring an umbrella. I got all ___3___.\nMs. Wu: We have ___4___ rain in spring. You should bring an umbrella with you all the time….\nPeter: Achoo! Sorry, Ms. Wu.\nMs. Wu: Bless you. Let me make a cup of hot tea ___5___ you.",
      items:[
        {options:["because of","so","because","but"],correct:2},
        {options:["Why","Where","What","Who"],correct:0},
        {options:["hurt","rainy","afraid","wet"],correct:3},
        {options:["a lot of","many","a little","a lot"],correct:3},
        {options:["to","for","with","of"],correct:1}
      ]
    },
    {
      type:"reading",
      title:"七、閱讀測驗",
      meta:"10分，每題2分",
      passages:[
        {
          label:"【A】",
          text:"Jane: Good morning, this is Dr. Lee's Clinic. How may I help you?\nLuke: Hi, this is Luke Johnson. Can I make an appointment for this afternoon, around 3 or 4 o'clock?\nJane: I'm sorry, Mr. Johnson. Dr. Lee isn't available this afternoon. Can you tell me about your problem?\nLuke: Last night, I felt cold, and my head felt heavy. I put on my coat and went to bed. However, now my throat hurts.\nJane: OK. Wait a minute, please. Let me talk to Dr. Lee about your problems.\nLuke: Sure, thank you.\n(One minute later.)\nJane: Hello, Mr. Johnson. Please drink some warm water and rest at home. You can come over around 7 p.m.\nLuke: Thanks a lot, and see you at 7.\n\n【字詞】clinic 診所　appointment 預約　available 有空的　tell 告訴（過去式為told）",
          items:[
            {q:"Why did Luke need to make an appointment?",options:["To answer the phone.","To buy medicine.","To call the clinic.","To see a doctor."],correct:3},
            {q:"Which is NOT true?",options:["Jane works for Dr. Lee.","Luke can't see Dr. Lee today.","Luke told Jane about his problems.","Luke called Dr. Lee's Clinic in the morning."],correct:3}
          ]
        },
        {
          label:"【B】",
          text:"Hello, we are Happy Life. We study fun life topics and share our findings with people around the world. You can see them in the newspapers on the first Monday of every month, and you can also find them on the Internet. Many of our \"studies\" are not serious ones, and they often show us fun facts.\nThis time, we invited 100 men and 100 women on the streets to answer the question: What do you usually do online? These people are between 20 and 55 years old. Now, let's take a look at the findings.",
          image:"images/test3/piecharts.png",
          items:[
            {q:"What can we say about Happy Life?",options:["It teaches us some ways to have a healthy life.","It talks about cool TV shows.","It tries to find different facts about people's lives.","It shares fun messages on the Internet."],correct:2},
            {q:"What do we know from the pie charts?",options:["Women buy things on the Internet, but men don't.","Only ten people read online.","About 50% of the men play games online.","Both men and women watch TV shows online."],correct:2},
            {q:"Which is true about Happy Life?",options:["All of its topics are serious and heavy.","It only invites young people to answer questions.","People can find its new topics every Monday.","People can send messages to them online."],correct:3}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderTable(t){
  if(!t) return "";
  const headHtml = `<tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>`;
  const rowsHtml = t.rows.map(r=>`<tr>${r.map((c,ci)=>ci===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div style="font-weight:700;text-align:center;color:var(--chalk-green);margin-bottom:6px;">${t.title}</div>
    <table class="data-table"><thead>${headHtml}</thead><tbody>${rowsHtml}</tbody></table>
    ${t.note ? `<div style="margin-top:8px;color:var(--ink-soft);font-size:13px;">${t.note}</div>` : ""}`;
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `${p.label ? `<span class="passage-label">${p.label}</span>`:""}${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}${p.table ? renderTable(p.table) : ""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
