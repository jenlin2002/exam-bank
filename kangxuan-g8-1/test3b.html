<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第3回 - Review 1（B卷）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}
  .data-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;background:#fff;}
  .data-table th, .data-table td{border:1px solid var(--paper-line);padding:6px 8px;text-align:center;}
  .data-table th{background:#eef3ea;color:var(--chalk-green);}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g8-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第3回・Review 1</h1>

<main>
  <div class="controls">

      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>

    </div>

  <div id="content"></div>

  <a class="footer-link" href="../kangxuan-g8-1.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "B卷", examLabel: "第3回" };
const DATA = {
  sections: [
    {
      type: "vocab",

        {q:"Bring a coat with you. It can p___t you from the cold in the mountains.", answer:"protect"},
        {q:"Dr. Chou was a doctor before. He t___ted many sick people in the hospital.", answer:"treated"}
      ]
    },
    {
      type:"mc",
      title:"二、字彙選擇",
      meta:"10分，每題2分",
      items:[
        {q:"Ben ___ to bring his math book yesterday, so Matt shared his with Ben.",options:["felt","cried","spoke","forgot"],correct:3},
        {q:"The old bus had a ___ problem. No one here could fix it.",options:["serious","healthy","strong","sore"],correct:0},
        {q:"My ___ hurt after the long hike in the mountains, so I rested for a few hours.",options:["legs","masks","showers","messages"],correct:0},
        {q:"Always keep your ___ warm in winter. It's a way to stay healthy.",options:["sky","body","call","nature"],correct:1},
        {q:"Listen! The noise is from David's ___. He's very hungry after the baseball game.",options:["head","hand","stomach","throat"],correct:2}
      ]
    },
    {
      type:"mc",
      title:"三、語法測驗",
      meta:"20分，每題2分",
      items:[
        {q:"A: ___ the weather in the mountains ___? B: I don't know. I was in Taipei then.",options:["How's; ×","What's; now","How was; last night","What was; yesterday"],correct:2},
        {q:"Jackie ___ a valentine（情人卡）___ Chloe this February. On the card, he told her, \"I love you.\"",options:["wrote; to","made; to","wrote; of","made; of"],correct:0},
        {q:"___ was only a little snow in the city last winter. It was a warm winter.",options:["It","We","They","There"],correct:3},
        {q:"Serena never visits the park in summer. It's always hot and ___ there.",options:["rain","rainy","rains","raining"],correct:1},
        {q:"A: ___ did Benson buy a basket of fruit this morning? B: He planned（計畫）to visit his aunt in the hospital.",options:["What","Who","Why","Where"],correct:2},
        {q:"This afternoon, Irene didn't go to the playground with us ___ she caught a bad cold.",options:["so","or","because","but"],correct:2},
        {q:"Jackson and Maggie enjoy the weather in the old town. ___ is sunny but not too hot.",options:["It","This","That","There"],correct:0},
        {q:"Look, this new black pan is my birthday gift（禮物）. My husband ___.",options:["gave it me","gave it to me","gave me it","gave me to it"],correct:1},
        {q:"Fanny worked until 10 p.m., ___ she didn't go to the movies with her friends this evening.",options:["however","until","or","so"],correct:3},
        {q:"___ the special robots, the fishermen can catch a lot of fish in a short time.",options:["Because of","Because","About","From"],correct:0}
      ]
    },
    {
      type:"mc",
      title:"四、完成句子與對話",
      meta:"10分，每題2分",
      items:[
        {q:"Larry: Good afternoon, Benji. Hey, are you OK? Benji: Well, no. ___",options:["I'm not afraid of dogs.","I'm strong and healthy again.","I'm a little under the weather.","I don't always see a doctor for a cold."],correct:2},
        {q:"Mrs. Chang: ___ Put the books away. It's time for the test. Students: OK, Mrs. Chang.",options:["No more questions, please.","It's great weather for photos today.","Watch out for the oncoming cars, kids.","The sky is bright, and the weather is fine."],correct:0},
        {q:"Doris: Today is Sunday. ___ Kevin: Well, he's away on business（出差）until next Friday.",options:["The weather is cool and windy.","How does your father feel now?","Is your father under the weather?","Why doesn't your father rest at home?"],correct:1},
        {q:"Tom: Hello! Welcome to Tom's Kitchen. ___ Sara: Hello. Please give us a table for ten.",options:["Can you bring some tables to me?","Why don't you have a seat?","What can I do for you?","What a hot day!"],correct:2},
        {q:"Frank: Hello, this is Frank. ___ Betty: Sure. Just a minute, please.",options:["How's Steve's day?","May I speak to Steve now?","Did Steve go to the doctor today?","How can Steve just sit there and cry?"],correct:1}
      ]
    },
    {
      type: "vocab",
      title: "五、填充題（填入正確的介系詞）",
      meta: "5分，每格1分",
      items: [
        {q:"It's a sunny day! Good weather ___ hiking!", answer:"for"},
        {q:"Jerry bought some new clothes ___ his son's birthday.", answer:"for"},
        {q:"Frank is afraid ___ the dark and always sleeps with the light on.", answer:"of"},
        {q:"Thanks to Jessie's umbrella, I didn't run home ___ the heavy shower.", answer:"in"},
        {q:"Don't forget to send the report ___ the teacher by the end of the day.", answer:"to"}

    {
      type:"guided",
      title:"六、依提示作答",
      meta:"8分，每題2分",
      items:[
        {prompt:"Please show the ticket to the man over there.",hint:"（省略介系詞並改寫句子）",answer:"Please show the man over there the ticket."},
        {prompt:"Judy made her sister a yummy strawberry pancake.",hint:"（加入for並改寫句子）",answer:"Judy made a yummy strawberry pancake for her sister."},

    {

      meta:"每格1分",
      items:[

        {zh:"那位科學家寫了一篇關於大自然變化的報告。",answer:"The scientist wrote a report on the changes in nature."},
        {zh:"A：為什麼你昨天喉嚨痛？ B：我在臺上說了很多話。",answer:"A: Why did you have a sore throat yesterday? B: I talked / spoke a lot on the stage."}
      ]
    },
    {
      type:"translation",
      title:"七、翻譯【B】整句式",
      meta:"每題3分",
      items:[
        {zh:"他們應該從上述例子中學習並解決這個問題。",answer:"They should learn from the examples above and solve the problem."},
        {zh:"那些漁夫怎麼了？他們今天早上全部都嚴重頭痛。（...happened...）",answer:"What happened to the fishermen? They all had a serious headache this morning."}
      ]
    },
    {
      type:"cloze",
      title:"八、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Lori: Mina, what are you doing in the bathroom? Are you having ___1___ trouble again?\nMina: Yes, I have the runs.\nLori: Oh no… ___2___ What did you eat this morning?\nMina: I didn't eat breakfast, but I took some diet pills two hours ago.\nLori: ___3___ did you take them? You're not fat.\nMina: You're so nice. But last Tuesday, Derek called me \"piggy.\" That made me really sad.\nLori: He did? That was so mean. ___4___, where did you get those pills?\nMina: I bought them online.\nLori: Oh no! You should never take ___5___ without asking a doctor first.\n\n【字詞】trouble 麻煩　have the runs 拉肚子　diet pill 減肥藥　piggy 豬　mean 苛薄的　without 沒有",
      items:[
        {options:["toe","stomach","head","shoulder"],correct:1},
        {options:["I love it!","I'm good.","Are you OK?","Thank you."],correct:2},
        {options:["When","How","What","Why"],correct:3},
        {options:["Look","Change","However","By the way"],correct:3},
        {options:["medicine","shower","coat","air"],correct:0}
      ]
    },
    {
      type:"reading",
      title:"九、閱讀測驗",
      meta:"12分，每題3分",
      passages:[
        {
          label:"",
          text:"Dear Friends,\nHow are you? I want to talk to you about climate change. It is happening all around us and is changing the world in many ways. Pollution from cars and factories is leading to global warming. Because of this, we are seeing more bad weather, like strong storms and floods. Ice in some places is melting, and this is leading to a rise in sea levels. Some islands are going under, and people there are losing their homes. We need to stop this. Let's try not to use plastic, save energy, and protect nature together. We can make a change for sure!\nTommy\n\n【字詞】pollution 汙染　factory 工廠　storm 暴風雨　flood 洪水　energy 能源",
          items:[
            {q:"What is Tommy's letter about?",options:["Nature.","A chat group.","Helping friends.","Saving animals."],correct:0},
            {q:"When the ice cream is melting, it becomes ___.",options:["soft","strong","sick","safe"],correct:0},
            {q:"What can we learn about Tommy from the letter?",options:["He's a fisherman.","He never uses plastic.","He lives on an island.","He's trying to help."],correct:3},
            {q:"According to the letter, which is NOT true?",options:["Global warming leads to bad weather.","Sea level plays a big role in people's lives.","Floods are good for people in some places.","Cars aren't friendly to the world in some ways."],correct:2}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderTable(t){
  if(!t) return "";
  const headHtml = `<tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>`;
  const rowsHtml = t.rows.map(r=>`<tr>${r.map((c,ci)=>ci===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("");
  return `${t.title ? `<div style="font-weight:700;text-align:center;color:var(--chalk-green);margin-bottom:6px;">${t.title}</div>`:""}
    <table class="data-table"><thead>${headHtml}</thead><tbody>${rowsHtml}</tbody></table>
    ${t.note ? `<div style="margin-top:8px;color:var(--ink-soft);font-size:13px;">${t.note}</div>` : ""}`;
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `${p.label ? `<span class="passage-label">${p.label}</span>`:""}${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}${p.table ? renderTable(p.table) : ""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="../sync.js"></script>
</body>
</html>
