<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第12回 - 聽力三（Lesson 5～6，B卷）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --paper-line:#e3dcc8; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --chalk-green-2:#3d5a48; --pen-red:#b8433a; --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52; --ok-green-soft:#dfeee1; --gold:#b5842a; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header.hero{background:var(--chalk-green);color:#eef2ea;padding:28px 20px 40px;position:relative;}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:10px 0 6px;}
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .notice{
    background:#fdf3e3;border:1px solid #ecd9ab;border-left:5px solid var(--gold);
    border-radius:var(--radius);padding:14px 18px;margin-bottom:22px;font-size:13.5px;color:#6b5424;
  }

  section.block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:22px 22px 26px;margin-bottom:20px;}
  .block h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 4px;color:var(--chalk-green);}
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 14px;}

  audio{width:100%;margin-bottom:18px;}
  .grid-img{width:100%;max-width:560px;display:block;margin:0 auto 16px;border-radius:8px;border:1px solid var(--paper-line);}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-size:14.5px;background:#fffdf8;}
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .footer-link{display:block;text-align:center;margin-top:30px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="../kangxuan-g8-1.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第12回・聽力三</h1>
    <p class="subtitle">Lesson 5～6｜康軒版八年級英語（三）Ｂ卷</p>
  </div>
</header>

<main>
  <div class="notice">🎧 B卷聽力題本沒有附逐字稿，此頁僅能作答對錯，無法顯示逐字稿內容。</div>

  <section class="block">
    <h2>一、辨識句意：選出符合句子描述的圖片</h2>
    <p class="meta">20分，每題4分</p>
    <audio controls src="audio/test12b/track1.mp3"></audio>
    <img class="grid-img" src="images/test12b/sec1_grid.png" alt="題目附圖">
    <div id="sec1"></div>
  </section>

  <section class="block">
    <h2>二、基本問答：選出最適合的回答，完成對話</h2>
    <p class="meta">40分，每題4分</p>
    <audio controls src="audio/test12b/track2.mp3"></audio>
    <div id="sec2"></div>
  </section>

  <section class="block">
    <h2>三、言談理解：請聽CD一段對話或短文及一個相關的問題後，選出一個最適合的答案</h2>
    <p class="meta">40分，每題4分</p>
    <audio controls src="audio/test12b/track3.mp3"></audio>
    <div id="sec3"></div>
  </section>

  <a class="footer-link" href="../kangxuan-g8-1.html">← 回段考題庫總覽</a>
</main>

<script>
function mc(container, items){
  items.forEach((it,i)=>{
    const q = document.createElement("div");
    q.className = "q";
    const optsHtml = it.options.map((op,oi)=>`
      <div class="opt" data-correct="${oi===it.correct}"><span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span></div>`).join("");
    q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q||""}</div><div class="opts">${optsHtml}</div>`;
    q.querySelectorAll(".opt").forEach(o=>o.addEventListener("click", ()=>{
      if(q.dataset.answered==="true") return;
      q.dataset.answered="true";
      q.querySelectorAll(".opt").forEach(x=>x.classList.add("disabled"));
      o.classList.add("selected");
      const correctOptEl = q.querySelector('.opt[data-correct="true"]');
      q.dataset.studentAnswer = o.textContent.trim();
      q.dataset.correctAnswer = correctOptEl ? correctOptEl.textContent.trim() : "";
      q.dataset.isCorrect = (o.dataset.correct==="true") ? "true" : "false";
    }));
    container.appendChild(q);
  });
}

// 一、辨識句意（見上方附圖 1~5）
mc(document.getElementById("sec1"), [
  {q:"圖1", options:["A","B","C"], correct:0},
  {q:"圖2", options:["A","B","C"], correct:1},
  {q:"圖3", options:["A","B","C"], correct:2},
  {q:"圖4", options:["A","B","C"], correct:1},
  {q:"圖5", options:["A","B","C"], correct:2}
]);

// 二、基本問答
mc(document.getElementById("sec2"), [
  {options:["She left for it an hour ago.","She went to the game by bike.","She joined the game with her friends."], correct:1},
  {options:["Yes, she visited him last year.","Yes, she will visit him this summer.","Yes, she usually calls him twice a day."], correct:2},
  {options:["No, she didn't find the museum.","No, she doesn't drive a taxi.","No, she got there on foot."], correct:0},
  {options:["He needed some eggs.","He was taking out some money.","He wanted to be at a quiet place."], correct:0},
  {options:["The bus comes every forty minutes.","Cross the street and go straight for a block.","You can come to my house at eight o'clock."], correct:2},
  {options:["He forgot to call me.","He left his phone at home.","He remembered to bring it."], correct:1},
  {options:["I see. I'm so sorry.","Same here! I love them.","No problem! Here you are."], correct:0},
  {options:["It takes me about twenty minutes.","Taking the metro to work is not expensive.","I take the metro to work every morning."], correct:1},
  {options:["It took her three hours to decide.","She spent two hours doing it.","She paid $20,000 for it."], correct:2},
  {options:["He is going to be eighteen.","He is going to the beach.","We had a party for him last week."], correct:2}
]);

// 三、言談理解
mc(document.getElementById("sec3"), [
  {options:["This weekend.","Tomorrow.","Next week."], correct:0},
  {options:["Hotels for their trip.","Ship tickets to Japan.","Japan's smartphones."], correct:2},
  {options:["The man didn't bring money with him.","The woman works in a flower shop.","The man's parents aren't at home."], correct:0},
  {options:["She is the woman's classmate.","She knows the man from the church.","She met the man when she was young."], correct:1},
  {options:["How much she will spend.","Who she will go with.","Where she will visit."], correct:0},
  {options:["\"What happened? Do you need some help?\"","\"Excuse me, sir. How do we get to the station?\"","\"Will you go to the station on foot tomorrow?\""], correct:2},
  {options:["Write with his left hand.","Write with both of his hands.","Catch a ball with his left hand."], correct:0},
  {options:["It cost her lots of money.","She spent a lot of time on it.","It didn't take her a long time to get it."], correct:1},
  {options:["He is practicing basketball.","He is leaving for the gym.","He is going to the soccer game."], correct:2},
  {options:["By metro.","By taxi.","By airplane."], correct:2}
]);
</script>
<script>window.EXAM_META = {version:"B卷", examLabel:"第12回"};</script>
<script src="../sync.js"></script>
</body>
</html>
