<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第8次平時考 B卷 - 聽力二（Lesson 3～4）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --paper-line:#e3dcc8; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --chalk-green-2:#3d5a48; --pen-red:#b8433a; --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52; --ok-green-soft:#dfeee1; --gold:#b5842a; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header.hero{background:var(--chalk-green);color:#eef2ea;padding:28px 20px 40px;position:relative;}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:10px 0 6px;}
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .notice{background:#fdf3e3;border:1px solid #ecd9ab;border-left:5px solid var(--gold);
    border-radius:var(--radius);padding:14px 18px;margin-bottom:22px;font-size:13.5px;color:#6b5424;}
  section.block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:22px 22px 26px;margin-bottom:20px;}
  .block h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 4px;color:var(--chalk-green);}
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 14px;}
  audio{width:100%;margin-bottom:18px;}
  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}
  .opts{display:grid;gap:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-size:14.5px;background:#fffdf8;}
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}
  .script-toggle{margin-top:6px;}
  .script-toggle button{background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .script-toggle button:disabled{opacity:.5;cursor:not-allowed;}
  .script{display:none;margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:10px 14px;white-space:pre-line;}
  .script.show{display:block;}
  .footer-link{display:block;text-align:center;margin-top:30px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第8次平時考（B卷）・聽力二</h1>
    <p class="subtitle">Lesson 3～4｜康軒版七年級英語（二）Ｂ卷</p>
  </div>
</header>
<main>
  <div class="notice">🎧 對應 CD 音軌 28～30。內容已對照PDF逐字稿核對，音軌長度也與題數相符。</div>

  <section class="block"><h2>一、辨識句意</h2><p class="meta">選出符合句子描述的圖片・20分，每題4分（原考卷為圖片題，此處以文字描述取代）</p>
    <audio controls src="audio/test8b/track1.mp3"></audio><div id="sec1"></div></section>

  <section class="block"><h2>二、基本問答</h2><p class="meta">選出最適合的回答，完成對話・40分，每題4分</p>
    <audio controls src="audio/test8b/track2.mp3"></audio><div id="sec2"></div></section>

  <section class="block"><h2>三、言談理解</h2><p class="meta">聽一段對話或短文及一個相關的問題，選出最適合的答案・40分，每題4分</p>
    <audio controls src="audio/test8b/track3.mp3"></audio><div id="sec3"></div></section>

  <a class="footer-link" href="index.html">← 回段考題庫總覽</a>
</main>
<script>
function mc(container, items){
  items.forEach((it,i)=>{
    const q = document.createElement("div"); q.className="q";
    const optsHtml = it.options.map((op,oi)=>`<div class="opt" data-correct="${oi===it.correct}"><span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span></div>`).join("");
    q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q||""}</div><div class="opts">${optsHtml}</div>
      ${it.script ? `<div class="script-toggle"><button disabled title="送出成績後解鎖">🔒 顯示逐字稿</button></div><div class="script">${it.script}</div>`:""}`;
    q.querySelectorAll(".opt").forEach(o=>o.addEventListener("click", ()=>{
      if(q.dataset.answered==="true") return; q.dataset.answered="true";
      q.querySelectorAll(".opt").forEach(x=>x.classList.add("disabled"));
      o.classList.add("selected");
      const correctOptEl = q.querySelector('.opt[data-correct="true"]');
      q.dataset.studentAnswer = o.textContent.trim();
      q.dataset.correctAnswer = correctOptEl ? correctOptEl.textContent.trim() : "";
      q.dataset.isCorrect = (o.dataset.correct==="true") ? "true" : "false";
    }));
    const tbtn = q.querySelector(".script-toggle button");
    if(tbtn) tbtn.addEventListener("click", ()=>q.querySelector(".script").classList.toggle("show"));
    container.appendChild(q);
  });
}

mc(document.getElementById("sec1"), [
  {q:"", options:["（圖片A）","Sarah needs two bags of flour and a bowl of strawberries.","（圖片C）"], correct:1},
  {q:"", options:["（圖片A）","（圖片B）","Everything in this tea house is delicious."], correct:2},
  {q:"", options:["（圖片A）","The tennis game is on November 20th.","（圖片C）"], correct:1},
  {q:"", options:["Diana does the housework on weekends.","（圖片B）","（圖片C）"], correct:0},
  {q:"", options:["（圖片A）","（圖片B）","Ryan's home is on the first floor."], correct:2}
]);

mc(document.getElementById("sec2"), [
  {q:"These egg noodles are cold. They're not yummy.", options:["I can heat them up for you.","Mix everything together.","It's not that difficult."], correct:0},
  {q:"What's the date today?", options:["It's at 10 p.m.","It's on the third floor.","It's February tenth."], correct:2},
  {q:"How much juice does Julie drink every day?", options:["She needs two.","Two bottles.","It's on March 7th."], correct:1},
  {q:"Whose soccer ball is that under the chair?", options:["It's him.","That's those boys'.","This is your classmate."], correct:1},
  {q:"Do you like this idea?", options:["Of course. It's cool.","No, it's over there.","Yes, I miss it."], correct:0},
  {q:"When is your math test?", options:["You can't join it.","That is a good idea.","It's on May 20th."], correct:2},
  {q:"Is this a letter to Jane?", options:["Yes, it's from her aunt.","Yes, it's two days away.","Yes, it's a good idea."], correct:0},
  {q:"How many cups do we need for the party?", options:["Two pieces of them.","Four or five cups.","Put some flour in them."], correct:1},
  {q:"Who takes care of the pet cat at home?", options:["Everyone in my family.","It plays the role of my brother.","It's in the bowl over there."], correct:0},
  {q:"Which do you like, tea eggs or fish balls?", options:["Pancakes are yummy.","We have enough fish.","I like both."], correct:2}
]);

mc(document.getElementById("sec3"), [
  {q:"When is the boy's sister's birthday?", options:["It's on February twentieth.","It's on February twenty-second.","It's on February twenty-third."], correct:2,
   script:"B: Is today February twentieth?\nG: Yes. Is it a special day for you?\nB: No. But my sister's birthday is three days away.\nG: She likes dolls. You can give her a cute doll."},
  {q:"Whose hat is it?", options:["It's Grace's.","It's Andy's.","It's the man's."], correct:1,
   script:"M: Is the hat on the chair yours, Grace?\nW: No, mine is blue, but this is red.\nM: Then whose hat is it?\nW: Oh, it's Andy's. There's his name on it."},
  {q:"What is right about the woman?", options:["She is the third person to get the pancakes.","She is the fourth person to get the pancakes.","She is the fifth person to get the pancakes."], correct:2,
   script:"M: What are you waiting for?\nW: I'm waiting for the pancakes. The pancakes in this tea house are delicious.\nM: Let me see... One... two... three.... There are four people in front of you.\nW: Yes, I can get the pancakes in about ten minutes."},
  {q:"What doesn't the man want?", options:["An apple pie.","A plate of noodles.","A bottle of juice."], correct:0,
   script:"W: Hello, Mr. Lin. What can I get you today?\nM: Can I have a plate of noodles and a bottle of juice?\nW: Of course. Do you want an apple pie?\nM: No, thanks. Noodles and juice are enough for me."},
  {q:"What is Greg doing at his birthday party now?", options:["He is preparing food.","He is doing the dishes.","He is having fun with everyone."], correct:0,
   script:"W: It's July eighth today. It's also Greg's birthday. Everyone in his class comes to the party. A lot of people are dancing, but Greg isn't. He's in the kitchen with his mother. They're making banana pancakes for everyone."},
  {q:"What are the man and the woman talking about?", options:["Exercise.","Homework.","Housework."], correct:2,
   script:"M: I am really busy today. Can you do the dishes for me?\nW: Sorry, I can't. I have a lot of homework, too.\nM: I can mop the floor for you on the weekend. How about that?\nW: Hmm... All right. I can help you today."},
  {q:"How much rice does the woman eat?", options:["Five bowls of rice.","One bowl of rice.","Three bowls of rice."], correct:1,
   script:"B: I'm hungry, Mom. Is lunch ready?\nW: Yes, we have fish and eggs. How much rice do you want?\nB: Three bowls of rice, please.\nW: Isn't that too much for you?\nB: I can only eat a bowl of rice."},
  {q:"What do we know about the pancakes?", options:["They are big but not yummy.","They are easy to make.","They are difficult to eat."], correct:1,
   script:"W: Come and eat some pancakes.\nM: Wow, they are cute and yummy.\nW: In fact, it's not difficult to make them. I can teach you.\nM: Thanks. But I only want to eat them."},
  {q:"What does the woman worry about?", options:["She can't win the race.","The players on her team aren't here.","The man isn't ready for the game."], correct:0,
   script:"M: Are you ready, Susan?\nW: I don't know... It's hard to win first place.\nM: Don't worry. You're a great runner.\nW: Thanks. Let's go to the sports field."},
  {q:"What is right about Sam?", options:["His sister takes care of him.","He can have fun on Oct. 18th.","He plays the role of a parent."], correct:2,
   script:"M: Hi, I'm Sam. I'm a busy senior high school student. I have a little sister, and I help her with her homework every day. My parents don't come home until 9 p.m., and I need to cook for my sister, too. August 18th is my birthday. I can take a break and have fun with my friends."}
]);
</script>
