<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第9次平時考 B卷 - Lesson 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .tabs{display:flex;gap:8px;}
  .tab-btn{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:15px;
    padding:9px 18px;
    border:2px solid var(--chalk-green);
    background:transparent;
    color:var(--chalk-green);
    border-radius:999px 999px 0 0;
    cursor:pointer;
  }
  .tab-btn[aria-selected="true"]{background:var(--chalk-green);color:#fff;}
  .tab-btn[disabled]{
    opacity:.45;cursor:not-allowed;border-color:var(--ink-soft);color:var(--ink-soft);
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  .coming-soon{
    text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;
  }

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第9次平時考・Lesson 5</h1>
    <p class="subtitle">You Helped Me a Lot｜康軒版七年級英語（二）B卷</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="index.html">← 回段考題庫總覽</a>
</main>

<script>

window.EXAM_META = { version: "B卷", examLabel: "第9次" };
const DATA = {
  sections: [
    {
      type: "vocab",
      title: "一、文意字彙",
      meta: "10分，每題2分",
      items: [
        {q:"My school is near my home. I can walk there in just five m___es.", answer:"minutes"},
        {q:"I need my c___r every day for work and for fun. It plays a big role in my life.", answer:"computer"},
        {q:"The teacher e___ned the math problem to the students, and now they all get it.", answer:"explained"},
        {q:"I'm writing a s___y for children. It's about a boy's life in the magic（魔法）world.", answer:"story"},
        {q:"A: Mr. Jonas is really busy now. B: I see. Let's talk to him l___r.", answer:"later"}
      ]
    },
    {
      type:"mc",
      title:"二、字彙選擇",
      meta:"10分，每題2分",
      items:[
        {q:"Jimmy likes to ___ his toys with his sister. He's a great brother.",options:["visit","camp","share","climb"],correct:2},
        {q:"Philip is a ___ man. He knows a lot about the world.",options:["lazy","wise","brown","wrong"],correct:1},
        {q:"There are a lot of beautiful pictures in the ___, and I like this one by Picasso very much.",options:["art","snack","science","museum"],correct:3},
        {q:"A: Can you play basketball? B: No, but I'm ___.",options:["crying","hunting","camping","learning"],correct:2},
        {q:"A: Is Brian your classmate? B: No. We don't ___ go to the same school.",options:["ago","just","even","before"],correct:2}
      ]
    },
    {
      type:"mc",
      title:"三、語法測驗",
      meta:"20分，每題2分",
      items:[
        {q:"A: Where ___ you a year ago? B: In the UK. I studied English there.",options:["do","did","was","were"],correct:2},
        {q:"A: What did you ___ last night? B: I played soccer on the field.",options:["do","did","does","doing"],correct:0},
        {q:"Don't watch TV right after school. You should ___ your homework first.",options:["do","does","did","doing"],correct:0},
        {q:"Doris ___ the library twice a week when（當……時）she was a high school student.",options:["visit","visits","visited","visiting"],correct:2},
        {q:"A: Weren't you an English teacher here? B: ___",options:["Yes, I was.","Yes, I were.","Yes, I wasn't.","No, I weren't."],correct:0},
        {q:"A: Wasn't this chair in your room ___? B: Yes, but I have a new one now.",options:["ago","last year","one hour before","two months then"],correct:1},
        {q:"My grandfather was a great badminton player ___. He's still good at playing it now.",options:["ago","before","one day","on Sundays"],correct:1},
        {q:"A: ___ Thomas's birthday party? B: I don't know. I wasn't there.",options:["How","How was","How are","How were"],correct:1},
        {q:"A: Did you help your brother with his homework? B: ___ He didn't need my help.",options:["Yes, I did.","Yes, I was.","No, I didn't.","No, I wasn't."],correct:2},
        {q:"I don't want to go out with Tommy again. He ___ nice before, but now he ___.",options:["was; is","is; isn't","was; isn't","was; wasn't"],correct:2}
      ]
    },
    {
      type:"mc",
      title:"四、完成句子與對話",
      meta:"10分，每題2分",
      items:[
        {q:"Charles: Look, there is a card on the bed. ___ Alita: \"Welcome to Blue Sky Hotel（飯店）!\"",options:["What does it say?","What did you just do?","Can we be your friends?","Oh, no. What can I do?"],correct:0},
        {q:"Pete: ___ Natty: Yes, but I was tired（疲累的）after it.",options:["What did you do last night?","Where did you go last night?","Was the practice last night fun?","Are you free this afternoon?"],correct:2},
        {q:"Dan: Isn't Andy smart? How can he do things like that? Ed: ___",options:["He played hide-and-seek with us.","Well, a man in love is never wise.","Oh, no! What's wrong with you?","In fact, he can't even stand or walk."],correct:1},
        {q:"Toby: I want to write a love letter to Jacey, but I don't know how. Vic: ___ Just write down your feelings（感情）!",options:["Well, that's easy.","Oh, I can explain everything.","With your help, I can do everything.","Are you kidding? You can't give her that."],correct:0},
        {q:"Rick: I can't believe it. ___ Chris: Yes, but he's 180 cm tall now, and he's good at soccer.",options:["Wasn't your cousin short before?","You were my classmate two years ago.","Weren't you the only child in your family?","Was your brother a great basketball player?"],correct:0}
      ]
    },
    {
      type: "vocab",
      title: "五、填充題（填入正確的be動詞）",
      meta: "5分，每格1分",
      items: [
        {q:"There ___ many people at the show. It was boring（無聊的）.", answer:"weren't"},
        {q:"Sammy was a cook a few years ago, but she ___ an apple farmer now.", answer:"is"},
        {q:"Those students ___ busy doing their homework in the library this afternoon.", answer:"were"},
        {q:"Look! The monkeys in the tree ___ cute and energetic. Let's give them some bananas.", answer:"are"},
        {q:"The birthday party ___ a lot of fun with games and delicious food. We were all very happy.", answer:"was"}
      ]
    },
    {
      type:"guided",
      title:"六、依提示作答",
      meta:"8分，每題2分",
      items:[
        {prompt:"We visited the museum this morning.",hint:"（依畫線部分造原問句）",answer:"What did you do this morning?"},
        {prompt:"Yes, I had some milk tea this afternoon.",hint:"（依畫線部分造原問句）",answer:"Did you have some milk tea this afternoon?"},
        {prompt:"Mrs. Chang is busy with work right now.",hint:"（畫線處以yesterday改寫）",answer:"Mrs. Chang was busy with work yesterday."},
        {prompt:"Were the students in the gym at that time?",hint:"（先否定簡答再詳答）",answer:"No, they weren't. They weren't in the gym at that time."}
      ]
    },
    {
      type:"guided-multi",
      title:"七、翻譯【A】引導式",
      meta:"每格1分",
      items:[
        {zh:"實際上，我的智慧型手機沒電了。我現在無法上網。",lines:["Actually, my smartphone is dead. I can't {{surf}} the {{Internet}} now."]},
        {zh:"我們可以從動物如何狩獵和分享食物中學到很多東西。",lines:["We can {{learn}} a lot from how animals {{hunt}} and {{share}} their food."]},
        {zh:"你錯了。從臺北搭高鐵到苗栗只要四十分鐘，不是一小時。",lines:["You're {{wrong}}. It takes only forty {{minutes}} from Taipei to Miaoli by HSR, not an {{hour}}."]}
      ]
    },
    {
      type:"translation",
      title:"七、翻譯【B】整句式",
      meta:"每題3分",
      items:[
        {zh:"我沒有在開玩笑。我這次救不了你。",answer:"I'm not kidding. I can't save you this time."},
        {zh:"我們一起分享零食並玩捉迷藏吧。",answer:"Let's share the snacks and play hide-and-seek together."}
      ]
    },
    {
      type:"cloze",
      title:"八、克漏字測驗",
      meta:"10分，每題2分",
      passage:"Lily: Look at Bob. He's so different now.\nLeo: True. He __1__ short and thin three years ago, but now he __1__ tall and strong. He's __2__ on the basketball team.\nLily: Really? He was lazy and wasn't good at any sports before, right?\nLeo: Right, but not anymore. Now he can __3__ basketball, baseball, tennis, and soccer. He's a great player. Look, he's really good at it.\nLily: Wow, I can't believe it. Then how often __4__ he play basketball?\nLeo: He practices with the team three times a week, and he also plays it at the park every weekend. Last night, he __5__ it with his brother for two hours after dinner.\nLily: Wow! You might not beat him now.\nLeo: Ha, you can say that again.",
      items:[
        {options:["is; is","is; was","was; is","was; was"],correct:2},
        {options:["so","just","even","before"],correct:1},
        {options:["play","plays","played","playing"],correct:0},
        {options:["do","does","did","doing"],correct:1},
        {options:["play","plays","played","playing"],correct:2}
      ]
    },
    {
      type:"reading",
      title:"九、閱讀測驗",
      meta:"12分，每題3分",
      passages:[
        {
          label:"",
          text:"Look at the two pictures. They show the park near Doris's house from five years ago and now.",
          image:"images/test9b/park.png",
          items:[
            {q:"What was in the place of the pond five years ago?",options:["A library.","A garden.","A large tree.","Some restrooms."],correct:2},
            {q:"What WASN'T in the park five years ago?",options:["A slide.","A pond.","Some swings.","Some seesaws."],correct:2},
            {q:"Which is still the same as it was five years ago?",options:["The city library.","The large garden.","The old restrooms.","The fun playground."],correct:3},
            {q:"Which is true about the two photos?",options:["There was a garden in the park before.","There aren't any restrooms in the library.","There was a library on the right side of the park.","There are two slides in the playground now."],correct:0}
          ]
        }
      ]
    }

  ]
};

let currentMode = "quiz"; // quiz | print

const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function render(){
  window.examAnswersRevealed = false;
  contentEl.innerHTML = "";
  DATA.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided-multi"){
    // 翻譯【A】引導式：每題可能有多個小空格，用 {{答案}} 標記
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const linesHtml = it.lines.map(line=>{
        const parts = line.split(/\{\{(.*?)\}\}/g);
        return parts.map((part,pi)=> pi%2===1
          ? `<input type="text" class="micro-blank" data-answer="${part}" style="width:${Math.max(60,part.length*13)}px;">`
          : part
        ).join("");
      }).join("<br>");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.zh ? it.zh+"<br>" : ""}${linesHtml}</div>
        <div class="answer-reveal">正解：${it.lines.map(l=>l.replace(/\{\{(.*?)\}\}/g,"$1")).join("　")}</div>`;
      q.querySelectorAll(".micro-blank").forEach(inp=>{
        inp.addEventListener("input", ()=>checkMultiBlank(q));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}${p.image ? `<img src="${p.image}" alt="附圖" style="width:100%;max-width:520px;display:block;margin:10px auto 0;border-radius:8px;border:1px solid var(--paper-line);">`:""}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
          ${it.image ? `<img src="${it.image}" alt="題目附圖" style="width:100%;max-width:500px;display:block;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
          <div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function checkMultiBlank(qEl){
  const inputs = Array.from(qEl.querySelectorAll(".micro-blank"));
  const anyEmpty = inputs.some(inp=>inp.value.trim().length===0);
  if(anyEmpty){ delete qEl.dataset.studentAnswer; updateScore(); return; }
  const allCorrect = inputs.every(inp=> inp.value.trim().toLowerCase() === inp.dataset.answer.trim().toLowerCase());
  qEl.dataset.studentAnswer = inputs.map(inp=>inp.value.trim()).join(" / ");
  qEl.dataset.correctAnswer = inputs.map(inp=>inp.dataset.answer).join(" / ");
  qEl.dataset.isCorrect = allCorrect ? "true" : "false";
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank") || q.querySelector("input.line-answer") || q.querySelector("input.micro-blank");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="sync.js"></script>
</body>
