<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜康軒版八年級社會（三）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --gold:#b5842a; --paper-line:#e3dcc8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header{background:var(--chalk-green);color:#eef2ea;padding:30px 20px 42px;position:relative;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .inner{max-width:900px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4vw,32px);margin:10px 0 6px;}
  .sub{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:900px;margin:0 auto;padding:28px 20px 70px;}
  .subject-title{
    font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px;color:var(--chalk-green);
    margin:36px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--paper-line);
    display:flex;align-items:center;gap:8px;
  }
  .subject-title:first-of-type{margin-top:0;}
  .grid{display:grid;gap:12px;}
  .card{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--paper-line);border-radius:10px;
    padding:14px 18px;text-decoration:none;color:var(--ink);
  }
  .card .name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16px;margin:0 0 3px;}
  .card .desc{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .versions{display:flex;gap:8px;flex-shrink:0;}
  .ver-btn{
    display:inline-block;font-family:"Noto Serif TC",serif;font-weight:700;font-size:13.5px;
    padding:7px 16px;border-radius:999px;text-decoration:none;
    background:var(--chalk-green);color:#eef2ea;border:1px solid var(--chalk-green);
  }
  .ver-btn:hover{background:var(--gold);border-color:var(--gold);}
  .ver-btn.disabled{
    background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);cursor:default;
  }
  .footer-link{display:block;text-align:center;margin-top:34px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
  @media (max-width:520px){
    .card{flex-direction:column;align-items:flex-start;}
    .versions{width:100%;}
    .ver-btn{flex:1;text-align:center;padding:7px 8px;}
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">國中題庫</a> ／ <a href="social.html" style="color:#cfe0d1;">社會科</a></div>
    <h1>段考題庫</h1>
    <p class="sub">康軒版八年級社會（三）平時考練習：地理・歷史・公民，題目會陸續增加</p>
  </div>
</header>

<main>
  <div id="bookContainer"></div>

  <script>
    const SECTIONS = [
      {icon:"🗺️", subject:"地理", folder:"geo", rounds:[
        {n:1, lesson:"第1課", title:"中國的自然環境", hrefA:"kangxuan-social-g8-1/geo1.html", hrefB:null, hrefC:null},
        {n:2, lesson:"第2課", title:"中國的人口成長與文化遷移", hrefA:"kangxuan-social-g8-1/geo2.html", hrefB:null, hrefC:null},
        {n:3, lesson:"第1~2課", title:"總複習", hrefA:"kangxuan-social-g8-1/geo3.html", hrefB:null, hrefC:null},
        {n:4, lesson:"第3課", title:"中國的產業發展與地區差異", hrefA:"kangxuan-social-g8-1/geo4.html", hrefB:null, hrefC:null},
        {n:5, lesson:"第4課", title:"中國的經濟發展與全球關連", hrefA:"kangxuan-social-g8-1/geo5.html", hrefB:null, hrefC:null},
        {n:6, lesson:"第3~4課", title:"總複習", hrefA:"kangxuan-social-g8-1/geo6.html", hrefB:null, hrefC:null},
        {n:7, lesson:"第5課", title:"東北亞的自然環境", hrefA:"kangxuan-social-g8-1/geo7.html", hrefB:null, hrefC:null},
        {n:8, lesson:"第6課", title:"東北亞的經濟發展", hrefA:"kangxuan-social-g8-1/geo8.html", hrefB:null, hrefC:null},
        {n:9, lesson:"第5~6課", title:"總複習", hrefA:"kangxuan-social-g8-1/geo9.html", hrefB:null, hrefC:null}
      ]},
      {icon:"📜", subject:"歷史", folder:"hist", rounds:[
        {n:1, lesson:"第1課", title:"商周至隋唐的國家與社會", hrefA:"kangxuan-social-g8-1/hist1.html", hrefB:null, hrefC:null},
        {n:2, lesson:"第2課", title:"商周至隋唐的民族與文化", hrefA:"kangxuan-social-g8-1/hist2.html", hrefB:null, hrefC:null},
        {n:3, lesson:"第1~2課", title:"總複習", hrefA:"kangxuan-social-g8-1/hist3.html", hrefB:null, hrefC:null},
        {n:4, lesson:"第3課", title:"宋元時期的民族互動", hrefA:"kangxuan-social-g8-1/hist4.html", hrefB:null, hrefC:null},
        {n:5, lesson:"第4課", title:"明清帝國與天朝體制", hrefA:"kangxuan-social-g8-1/hist5.html", hrefB:null, hrefC:null},
        {n:6, lesson:"第3~4課", title:"總複習", hrefA:"kangxuan-social-g8-1/hist6.html", hrefB:null, hrefC:null},
        {n:7, lesson:"第5課", title:"西力衝擊下的晚清變革", hrefA:"kangxuan-social-g8-1/hist7.html", hrefB:null, hrefC:null},
        {n:8, lesson:"第6課", title:"晚清的社會文化變遷", hrefA:"kangxuan-social-g8-1/hist8.html", hrefB:null, hrefC:null},
        {n:9, lesson:"第5~6課", title:"總複習", hrefA:"kangxuan-social-g8-1/hist9.html", hrefB:null, hrefC:null}
      ]},
      {icon:"⚖️", subject:"公民", folder:"civ", rounds:[
        {n:1, lesson:"第1課", title:"國家與民主政治", hrefA:"kangxuan-social-g8-1/civ1.html", hrefB:null, hrefC:null},
        {n:2, lesson:"第2課", title:"民主國家中的公共意見", hrefA:"kangxuan-social-g8-1/civ2.html", hrefB:null, hrefC:null},
        {n:3, lesson:"第1~2課", title:"總複習", hrefA:"kangxuan-social-g8-1/civ3.html", hrefB:null, hrefC:null},
        {n:4, lesson:"第3課", title:"政府與權力分立", hrefA:"kangxuan-social-g8-1/civ4.html", hrefB:null, hrefC:null},
        {n:5, lesson:"第4課", title:"我國的中央政府", hrefA:"kangxuan-social-g8-1/civ5.html", hrefB:null, hrefC:null},
        {n:6, lesson:"第3~4課", title:"總複習", hrefA:"kangxuan-social-g8-1/civ6.html", hrefB:null, hrefC:null},
        {n:7, lesson:"第5課", title:"我國的地方政府", hrefA:"kangxuan-social-g8-1/civ7.html", hrefB:null, hrefC:null},
        {n:8, lesson:"第6課", title:"民主社會的政治參與及投票", hrefA:"kangxuan-social-g8-1/civ8.html", hrefB:null, hrefC:null},
        {n:9, lesson:"第5~6課", title:"總複習", hrefA:null, hrefB:null, hrefC:null}
      ]}
    ];
    const container = document.getElementById("bookContainer");
    SECTIONS.forEach(sec=>{
      const title = document.createElement("div");
      title.className = "subject-title";
      title.innerHTML = `<span>${sec.icon}</span><span>${sec.subject}</span>`;
      container.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";
      sec.rounds.forEach(r=>{
        const el = document.createElement("div");
        el.className = "card";
        const verBtn = (href, label) => href
          ? `<a class="ver-btn" href="${href}">${label}</a>`
          : `<span class="ver-btn disabled">${label}</span>`;
        el.innerHTML = `
          <div>
            <p class="name">第${r.n}回・${r.lesson}</p>
            <p class="desc">${r.title}</p>
          </div>
          <div class="versions">
            ${verBtn(r.hrefA, "A卷")}
            ${verBtn(r.hrefB, "B卷")}
            ${verBtn(r.hrefC, "C卷")}
          </div>`;
        grid.appendChild(el);
      });
      container.appendChild(grid);
    });
  </script>

  <a class="footer-link" href="social.html">← 回社會科總目錄</a>
</main>
</body>
</html>
