<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第4次平時考 B卷 - 聽力一（Lesson 1～2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --paper-line:#e3dcc8; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --chalk-green-2:#3d5a48; --pen-red:#b8433a; --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52; --ok-green-soft:#dfeee1; --gold:#b5842a; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header.hero{background:var(--chalk-green);color:#eef2ea;padding:28px 20px 40px;position:relative;}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:10px 0 6px;}
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .notice{background:#fdf3e3;border:1px solid #ecd9ab;border-left:5px solid var(--gold);
    border-radius:var(--radius);padding:14px 18px;margin-bottom:22px;font-size:13.5px;color:#6b5424;}
  section.block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:22px 22px 26px;margin-bottom:20px;}
  .block h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 4px;color:var(--chalk-green);}
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 14px;}
  audio{width:100%;margin-bottom:18px;}
  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}
  .opts{display:grid;gap:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-size:14.5px;background:#fffdf8;}
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}
  .script-toggle{margin-top:6px;}
  .script-toggle button{background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .script-toggle button:disabled{opacity:.5;cursor:not-allowed;}
  .script{display:none;margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:10px 14px;white-space:pre-line;}
  .script.show{display:block;}
  .footer-link{display:block;text-align:center;margin-top:30px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第4次平時考（B卷）・聽力一</h1>
    <p class="subtitle">Lesson 1～2｜康軒版七年級英語（二）Ｂ卷</p>
  </div>
</header>
<main>
  <div class="notice">🎧 對應 CD 音軌 25～27，內容已對照逐字稿並用音檔長度核對過（辨識句意約80秒、基本問答約145秒、言談理解約530秒，都跟題數對得上）。</div>

  <section class="block"><h2>一、辨識句意</h2><p class="meta">選出符合句子描述的圖片・20分，每題4分（原考卷為圖片題，此處以文字描述取代）</p>
    <audio controls src="audio/test4b/track1.mp3"></audio><div id="sec1"></div></section>

  <section class="block"><h2>二、基本問答</h2><p class="meta">選出最適合的回答，完成對話・40分，每題4分</p>
    <audio controls src="audio/test4b/track2.mp3"></audio><div id="sec2"></div></section>

  <section class="block"><h2>三、言談理解</h2><p class="meta">聽一段對話或短文及一個相關的問題，選出最適合的答案・40分，每題4分</p>
    <audio controls src="audio/test4b/track3.mp3"></audio><div id="sec3"></div></section>

  <a class="footer-link" href="index.html">← 回段考題庫總覽</a>
</main>
<script>
function mc(container, items){
  items.forEach((it,i)=>{
    const q = document.createElement("div"); q.className="q";
    const optsHtml = it.options.map((op,oi)=>`<div class="opt" data-correct="${oi===it.correct}"><span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span></div>`).join("");
    q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q||""}</div><div class="opts">${optsHtml}</div>
      ${it.script ? `<div class="script-toggle"><button disabled title="送出成績後解鎖">🔒 顯示逐字稿</button></div><div class="script">${it.script}</div>`:""}`;
    q.querySelectorAll(".opt").forEach(o=>o.addEventListener("click", ()=>{
      if(q.dataset.answered==="true") return; q.dataset.answered="true";
      q.querySelectorAll(".opt").forEach(x=>x.classList.add("disabled"));
      o.classList.add("selected");
      const correctOptEl = q.querySelector('.opt[data-correct="true"]');
      q.dataset.studentAnswer = o.textContent.trim();
      q.dataset.correctAnswer = correctOptEl ? correctOptEl.textContent.trim() : "";
      q.dataset.isCorrect = (o.dataset.correct==="true") ? "true" : "false";
    }));
    const tbtn = q.querySelector(".script-toggle button");
    if(tbtn) tbtn.addEventListener("click", ()=>q.querySelector(".script").classList.toggle("show"));
    container.appendChild(q);
  });
}

mc(document.getElementById("sec1"), [
  {q:"", options:["（圖片A：棒球）","（圖片B：足球）","Jimmy is practicing badminton with his team."], correct:2},
  {q:"", options:["（$50）","（$100）","My breakfast is 150 dollars."], correct:2},
  {q:"", options:["（圖片A）","（圖片B）","Jayden goes to his grandparents' house twice a month."], correct:2},
  {q:"", options:["Rick and Sara are doing their homework together.","（圖片B）","（圖片C）"], correct:0},
  {q:"", options:["The teacher worries about her student. He always gets bad grades.","（圖片B）","（圖片C）"], correct:0}
]);

mc(document.getElementById("sec2"), [
  {q:"Do you enjoy your school life?", options:["Yes, I read books with my parents.","No, I am not doing my homework.","Sure. I like my teachers and classmates."], correct:2},
  {q:"What do you do after school?", options:["We can exercise together.","I don't do that, either.","I study at the library."], correct:2},
  {q:"Jerry cleans his toilet only once or twice a year.", options:["That's fun.","That's terrible.","That's a good habit."], correct:1},
  {q:"Shelly doesn't know everyone's name.", options:["Well, she is new here.","Well, she moves fast.","Well, she enjoys the class."], correct:0},
  {q:"How much is this cellphone?", options:["It is free.","Ten times a day.","From the night market."], correct:0},
  {q:"The ticket for the basketball game is on me.", options:["Really? Thanks!","OK! Let's play soccer this afternoon.","Yes, I need two tickets to Tainan."], correct:0},
  {q:"The toilet seat is really dirty.", options:["Right. There aren't a lot of germs.","Right. I often have fun there.","Right. People seldom clean it."], correct:2},
  {q:"How often do you play in the playground?", options:["I can't go now.","Not very often.","In my free time."], correct:1},
  {q:"I don't have time for video games. I don't have time for any sports, either.", options:["That must be hard.","Tennis is my life.","I'm on the school team."], correct:0},
  {q:"Dylan never cooks at home.", options:["Yeah. He always eats out.","Yeah. He is a very good cook.","Yeah. He might be hungry now."], correct:0}
]);

mc(document.getElementById("sec3"), [
  {q:"Who usually takes out the trash?", options:["The man.","The woman.","The woman and the man."], correct:1,
   script:"M: Can you take out the trash today?\nW: Wait, what? I take out the trash from Monday to Friday!\nM: I know, but I have too much work today.\nW: All right. I can do that for you, but only this time."},
  {q:"How often does the man clean the bathroom?", options:["About once a month.","About twice a month.","About eight times a month."], correct:2,
   script:"W: Wow, your room is really clean.\nM: Thanks. In fact, it's my brother's room. He cleans it once a week.\nW: Don't you clean your room?\nM: No, but I clean our bathroom twice a week."},
  {q:"How much are the man's shoes?", options:["200 dollars.","600 dollars.","900 dollars."], correct:2,
   script:"M: Your shoes are cool.\nW: They're from my mom, and they're only 200 dollars.\nM: Really? Look. My shoes aren't cool, but they're 900 dollars.\nW: Come on. Those are really nice shoes."},
  {q:"Who goes to the library every weekend?", options:["The man.","The woman and the boy.","The woman and her sister."], correct:2,
   script:"W: Where do you study on weekends?\nM: I study at home. What about you?\nW: I go to the library with my sister. It's quiet there.\nM: I see. Let's go there together next time."},
  {q:"Who never does the housework?", options:["The girl's sister.","The girl's brother.","The girl's parents."], correct:0,
   script:"G: In my family, everyone must do the housework. My dad takes out the trash. My mom prepares dishes. My brother does the dishes and mops the floor. I clean the table and the toilet. However, my sister doesn't do the housework. She is only one year old."},
  {q:"What days doesn't Mike practice basketball?", options:["On Mondays.","On Wednesdays.","On Thursdays."], correct:2,
   script:"M: Mike is a great basketball player. He's in your class, right?\nW: Yes. He practices basketball a lot.\nM: Does he practice every day?\nW: No, only on Mondays, Wednesdays, and Fridays."},
  {q:"What does the man do in the morning?", options:["He takes a bus.","He cooks breakfast.","He exercises."], correct:2,
   script:"W: Do you take a bath every morning?\nM: Yes, I do. I exercise in the morning.\nW: Wow. What time do you get up?\nM: At five or six, but I go to bed at ten."},
  {q:"What is true about the man and the woman?", options:["They enjoy the movie.","They play sports.","They might go home now."], correct:1,
   script:"M: Can we win the basketball game this time?\nW: I'm not sure. Those players are really good.\nM: Don't worry. We are great players, too.\nW: You're right. Let's enjoy the game."},
  {q:"What do we know about the woman?", options:["She can't go to the park with the man.","There's a new gym near her place.","Her group chat is about parks."], correct:0,
   script:"M: Do you have time? Let's go to the new park together.\nW: Sorry. I have a lot of homework today.\nM: What about next Saturday?\nW: Well, I have a group chat from 10 to 11."},
  {q:"Who doesn't have classes in the morning?", options:["Jake.","Abby.","Jake and Abby."], correct:2,
   script:"M: Hi, I'm Jake. I'm a 20-year-old student, and my sister, Abby, is a student, too. I don't have classes at school in the morning, and Abby doesn't, either. After breakfast, I practice basketball, and Abby studies at home. We enjoy our lives."}
]);
</script>

</body>
</html>
