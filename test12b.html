<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第12次平時考 B卷 - 聽力三（Lesson 5～6）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --paper-line:#e3dcc8; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --chalk-green-2:#3d5a48; --pen-red:#b8433a; --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52; --ok-green-soft:#dfeee1; --gold:#b5842a; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header.hero{background:var(--chalk-green);color:#eef2ea;padding:28px 20px 40px;position:relative;}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:10px 0 6px;}
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .notice{background:#fdf3e3;border:1px solid #ecd9ab;border-left:5px solid var(--gold);
    border-radius:var(--radius);padding:14px 18px;margin-bottom:22px;font-size:13.5px;color:#6b5424;}
  section.block{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:22px 22px 26px;margin-bottom:20px;}
  .block h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 4px;color:var(--chalk-green);}
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 14px;}
  audio{width:100%;margin-bottom:18px;}
  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}
  .opts{display:grid;gap:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-size:14.5px;background:#fffdf8;}
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}
  .script-toggle{margin-top:6px;}
  .script-toggle button{background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .script-toggle button:disabled{opacity:.5;cursor:not-allowed;}
  .script{display:none;margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:10px 14px;white-space:pre-line;}
  .script.show{display:block;}
  .footer-link{display:block;text-align:center;margin-top:30px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">段考題庫</a></div>
    <h1>第12次平時考（B卷）・聽力三</h1>
    <p class="subtitle">Lesson 5～6｜康軒版七年級英語（二）Ｂ卷</p>
  </div>
</header>
<main>
  <div class="notice">🎧 對應 CD 音軌 31～33。內容已對照PDF逐字稿核對，音軌長度也與題數相符。</div>

  <section class="block"><h2>一、辨識句意</h2><p class="meta">選出符合句子描述的圖片・20分，每題4分</p>
    <audio controls src="audio/test12b/track1.mp3"></audio><div id="sec1"></div></section>

  <section class="block"><h2>二、基本問答</h2><p class="meta">選出最適合的回答，完成對話・40分，每題4分</p>
    <audio controls src="audio/test12b/track2.mp3"></audio><div id="sec2"></div></section>

  <section class="block"><h2>三、言談理解</h2><p class="meta">聽一段對話或短文及一個相關的問題，選出最適合的答案・40分，每題4分</p>
    <audio controls src="audio/test12b/track3.mp3"></audio><div id="sec3"></div></section>

  <a class="footer-link" href="index.html">← 回段考題庫總覽</a>
</main>
<script>
function mc(container, items){
  items.forEach((it,i)=>{
    const q = document.createElement("div"); q.className="q";
    const optsHtml = it.options.map((op,oi)=>`<div class="opt" data-correct="${oi===it.correct}"><span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span></div>`).join("");
    q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q||""}</div>
      ${it.image ? `<img src="${it.image}" alt="第${i+1}題圖片" style="width:100%;border-radius:8px;margin-bottom:10px;border:1px solid var(--paper-line);">`:""}
      <div class="opts">${optsHtml}</div>
      ${it.script ? `<div class="script-toggle"><button disabled title="送出成績後解鎖">🔒 顯示逐字稿</button></div><div class="script">${it.script}</div>`:""}`;
    q.querySelectorAll(".opt").forEach(o=>o.addEventListener("click", ()=>{
      if(q.dataset.answered==="true") return; q.dataset.answered="true";
      q.querySelectorAll(".opt").forEach(x=>x.classList.add("disabled"));
      o.classList.add("selected");
      const correctOptEl = q.querySelector('.opt[data-correct="true"]');
      q.dataset.studentAnswer = o.textContent.trim();
      q.dataset.correctAnswer = correctOptEl ? correctOptEl.textContent.trim() : "";
      q.dataset.isCorrect = (o.dataset.correct==="true") ? "true" : "false";
    }));
    const tbtn = q.querySelector(".script-toggle button");
    if(tbtn) tbtn.addEventListener("click", ()=>q.querySelector(".script").classList.toggle("show"));
    container.appendChild(q);
  });
}

mc(document.getElementById("sec1"), [
  {q:"", image:"images/test12b/sec1_q1.png", options:["","",""], correct:2},
  {q:"", image:"images/test12b/sec1_q2.png", options:["","",""], correct:0},
  {q:"", image:"images/test12b/sec1_q3.png", options:["","",""], correct:1},
  {q:"", image:"images/test12b/sec1_q4.png", options:["","",""], correct:1},
  {q:"", image:"images/test12b/sec1_q5.png", options:["","",""], correct:0}
]);

mc(document.getElementById("sec2"), [
  {q:"Were you a teacher before?", options:["Yes, I was.","No, I didn't.","Well, I really should."], correct:0},
  {q:"Where was Sandy last Thursday?", options:["She was in the USA then.","She went camping the next day.","She hiked in the mountains years ago."], correct:0},
  {q:"Son, please bring me a blanket.", options:["Oh, no. What can I do?","Really? That was so cool!","No problem! Just wait here!"], correct:2},
  {q:"Thanks to you, I'm happy again.", options:["Here we are.","That's fine, thank you.","No problem. We're friends."], correct:2},
  {q:"Can you lead me to the school library?", options:["Wow! That's amazing!","Sure! Please follow me.","Sorry! I can't give you that."], correct:1},
  {q:"How did this special program start?", options:["In fact, I'm just kidding.","Well, you're a true friend.","Uhm, it began with a sad story."], correct:2},
  {q:"What can we do in the playground?", options:["Let's buy some snacks there.","Let's play hide-and-seek there.","Let's collect books there."], correct:1},
  {q:"Didn't you win first place in the race?", options:["Yeah. What's wrong?","Yeah. When was it?","Yeah. Don't be so lazy."], correct:0},
  {q:"William wanted a letter from me.", options:["Wait, what? I can't read or write.","Wait, what? Explain everything to me.","Wait, what? Share your snacks with me."], correct:1},
  {q:"How can we help save the beach?", options:["Hmm... we can just give it away to the poor.","Hmm... we can collect around a million books.","Hmm... we can get people together to clean it up."], correct:2}
]);

mc(document.getElementById("sec3"), [
  {q:"What time is the English class?", options:["It's at nine.","It's at ten.","It's at eleven."], correct:1,
   script:"M: Hurry up. Let's go to Classroom 203.\nW: Wait. What time does the English class start?\nM: At 10:00.\nW: It's only 9:00 now. The class is in one hour."},
  {q:"What do we know about Bella?", options:["She was a player.","She hated sports.","She was not tall."], correct:2,
   script:"M: Is this your daughter, Bella? She looks different now.\nW: Yes. She was short a year ago.\nM: That's right. Look at her. She likes basketball, too.\nW: True! In fact, she plays basketball three times a week, and she is tall now."},
  {q:"Where might the woman and the boy be?", options:["In a school gym.","In the playground.","In an art museum."], correct:2,
   script:"W: Stop running around, Andy.\nB: OK, Mom. Mom, look at those pictures. They aren't beautiful.\nW: Andy, that's enough. They're special pieces of art from a long time ago. Please be nice and keep your voice down.\nB: I'm sorry, Mom."},
  {q:"How much is the woman's new car?", options:["500,000 dollars.","1,000,000 dollars.","2,000,000 dollars."], correct:0,
   script:"W: How much is my new car? Take a guess.\nM: Isn't this type of car expensive? Well, is it two million dollars?\nW: No, it's not that expensive.\nM: Is it a million dollars, then?\nW: Ha, I bought it for only half a million dollars."},
  {q:"How was Mr. Wang's house?", options:["It was dirty.","It was clean.","It was amazing."], correct:0,
   script:"M: I like a TV show very much. Its name is Let's Break a Bad Habit. In this show, we can see many different people with bad habits. For example, Mr. Wang seldom cleaned his house. A special person went to his house and helped him. The house is clean, and they are even good friends now. Isn't it great?"},
  {q:"What can we say about Paige?", options:["She is lazy.","She is wise.","She is poor."], correct:1,
   script:"M: Every time I don't know the answer, I ask Paige for help.\nW: Me too! She always knows the right answer and can explain it to us.\nM: She's really great at this. She can be a great teacher one day.\nW: You can say that again."},
  {q:"What do we know about the beach?", options:["It wasn't clean before.","There's a lot of trash on it.","People couldn't play in the water there."], correct:1,
   script:"W: The beach was clean before, but it is very dirty now.\nM: That's true! People played in the water but didn't take their trash home.\nW: What can we do about it?\nM: Let's get some people together and clean up the beach.\nW: Good idea. We really need a clean beach!"},
  {q:"What might the man and the woman write in the card?", options:["\"Thanks to you, life is hard.\"","\"You're so wrong. We hate you.\"","\"With your help, we learned a lot.\""], correct:2,
   script:"W: The camp is about to come to an end. I might miss everything and our teacher, Cindy.\nM: Me too. She takes good care of us and leads us in many ways. She's a great teacher.\nW: Let's write a thank-you card to her. What do you think?\nM: That's a great idea!"},
  {q:"Where DIDN'T the woman go on the island?", options:["The lake.","The beach.","The mountains."], correct:0,
   script:"M: Hey, Jill. How was your holiday on the island?\nW: It was amazing! I swam at the beach, hiked in mountains, and had many delicious dishes. Everything was great. I miss my time there.\nM: Didn't you visit the lake near the airport?\nW: Well, no. It's a must-visit, but I didn't care much for it."},
  {q:"What do we know about the woman?", options:["She is energetic and never needs a break.","She hates to share things with her brother.","She is lazy and seldom helps with the housework."], correct:1,
   script:"W: My brother is only ten years old. Every time I don't want to help him with his homework, he goes to Mom. Every time I don't want to share my snacks with him, he goes to Mom. Every time I don't want to share my video games with him, he goes to Mom. Sometimes, I just want to take a break from all of this. What can I do?"}
]);
</script>
