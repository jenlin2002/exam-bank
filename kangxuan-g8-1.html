<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜康軒版八年級英語（三）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --gold:#b5842a; --paper-line:#e3dcc8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header{background:var(--chalk-green);color:#eef2ea;padding:30px 20px 42px;position:relative;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .inner{max-width:820px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4vw,32px);margin:10px 0 6px;}
  .sub{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:820px;margin:0 auto;padding:28px 20px 70px;}
  .grid{display:grid;gap:14px;}
  .card{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--paper-line);border-radius:10px;
    padding:18px 20px;text-decoration:none;color:var(--ink);
  }
  .card .name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;margin:0 0 4px;}
  .card .desc{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .versions{display:flex;gap:8px;flex-shrink:0;}
  .ver-btn{
    display:inline-block;font-family:"Noto Serif TC",serif;font-weight:700;font-size:13.5px;
    padding:7px 16px;border-radius:999px;text-decoration:none;
    background:var(--chalk-green);color:#eef2ea;border:1px solid var(--chalk-green);
  }
  .ver-btn:hover{background:var(--gold);border-color:var(--gold);}
  .ver-btn.disabled{
    background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);cursor:default;
  }
  .ver-btn.disabled:hover{background:transparent;border-color:var(--paper-line);}
  @media (max-width:520px){
    .card{flex-direction:column;align-items:flex-start;}
    .versions{width:100%;}
    .ver-btn{flex:1;text-align:center;padding:7px 8px;}
  }
  .footer-link{display:block;text-align:center;margin-top:34px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ <a href="index.html" style="color:#cfe0d1;">國中題庫</a> ／ <a href="english.html" style="color:#cfe0d1;">英語科</a></div>
    <h1>段考題庫</h1>
    <p class="sub">康軒版八年級英語（三）平時考練習，題目會陸續增加</p>
  </div>
</header>

<main>
  <div class="grid" id="examGrid"></div>
  <script>
    const EXAMS = [
      {n:1, lesson:"Lesson 1", title:"It Rained a Lot Yesterday", type:"筆試", href:"kangxuan-g8-1/test1.html", hrefB:"kangxuan-g8-1/test1b.html", hrefC:"kangxuan-g8-1/test1c.html"},
      {n:2, lesson:"Lesson 2", title:"Why Didn't You See a Doctor?", type:"筆試", href:"kangxuan-g8-1/test2.html", hrefB:"kangxuan-g8-1/test2b.html", hrefC:"kangxuan-g8-1/test2c.html"},
      {n:3, lesson:"Review 1", title:"Lesson 1～2 總複習", type:"筆試", href:"kangxuan-g8-1/test3.html", hrefB:"kangxuan-g8-1/test3b.html", hrefC:"kangxuan-g8-1/test3c.html"},
      {n:4, lesson:"Lesson 1～2", title:"聽力測驗一", type:"聽力", href:"kangxuan-g8-1/test4.html", hrefB:"kangxuan-g8-1/test4b.html", hrefC:"kangxuan-g8-1/test4c.html"},
      {n:5, lesson:"Lesson 3", title:"Tina and Billy Were Looking for Water", type:"筆試", href:"kangxuan-g8-1/test5.html", hrefB:"kangxuan-g8-1/test5b.html", hrefC:"kangxuan-g8-1/test5c.html"},
      {n:6, lesson:"Lesson 4", title:"I Want to Be a YouTuber", type:"筆試", href:"kangxuan-g8-1/test6.html", hrefB:"kangxuan-g8-1/test6b.html", hrefC:null},
      {n:7, lesson:"Review 2", title:"Lesson 3～4 總複習", type:"筆試", href:"kangxuan-g8-1/test7.html", hrefB:"kangxuan-g8-1/test7b.html", hrefC:null},
      {n:8, lesson:"Lesson 3～4", title:"聽力測驗二", type:"聽力", href:"kangxuan-g8-1/test8.html", hrefB:"kangxuan-g8-1/test8b.html", hrefC:null},
      {n:9, lesson:"Lesson 5", title:"How Long Will We Stay in Bangkok?", type:"筆試", href:"kangxuan-g8-1/test9.html", hrefB:"kangxuan-g8-1/test9b.html", hrefC:null},
      {n:10, lesson:"Lesson 6", title:"How Do We Get to Joe's House?", type:"筆試", href:"kangxuan-g8-1/test10.html", hrefB:"kangxuan-g8-1/test10b.html", hrefC:null},
      {n:11, lesson:"Review 3", title:"Lesson 5～6 總複習", type:"筆試", href:"kangxuan-g8-1/test11.html", hrefB:"kangxuan-g8-1/test11b.html", hrefC:null},
      {n:12, lesson:"Lesson 5～6", title:"聽力測驗三", type:"聽力", href:"kangxuan-g8-1/test12.html", hrefB:"kangxuan-g8-1/test12b.html", hrefC:null}
    ];
    const grid = document.getElementById("examGrid");
    EXAMS.forEach(ex=>{
      const el = document.createElement("div");
      el.className = "card";
      const verBtn = (href, label) => href
        ? `<a class="ver-btn" href="${href}">${label}</a>`
        : `<span class="ver-btn disabled">${label}</span>`;
      el.innerHTML = `
        <div>
          <p class="name">第${ex.n}回・${ex.lesson}</p>
          <p class="desc">${ex.title}｜${ex.type}</p>
        </div>
        <div class="versions">
          ${verBtn(ex.href, "A卷")}
          ${verBtn(ex.hrefB, "B卷")}
          ${verBtn(ex.hrefC, "C卷")}
        </div>`;
      grid.appendChild(el);
    });
  </script>
  <a class="footer-link" href="english.html">← 回英語科總目錄</a>
</main>
</body>
</html>
