<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜康軒版七年級英語（二）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --gold:#b5842a; --paper-line:#e3dcc8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header{background:var(--chalk-green);color:#eef2ea;padding:30px 20px 42px;position:relative;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .inner{max-width:820px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4vw,32px);margin:10px 0 6px;}
  .sub{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:820px;margin:0 auto;padding:28px 20px 70px;}
  .grid{display:grid;gap:14px;}
  .card{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border:1px solid var(--paper-line);border-radius:10px;
    padding:18px 20px;text-decoration:none;color:var(--ink);
  }
  .card.active:hover{border-color:var(--chalk-green);}
  .card .name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;margin:0 0 4px;}
  .card .desc{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .card .arrow{color:var(--gold);font-size:20px;}
  .card.disabled{opacity:.5;}
  .badge{
    display:inline-block;font-size:12px;background:var(--gold);color:#fff;
    padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;
  }
  .footer-link{display:block;text-align:center;margin-top:34px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a></div>
    <h1>段考題庫</h1>
    <p class="sub">康軒版七年級英語（二）平時考練習，題目會陸續增加</p>
  </div>
</header>
<main>
  <div class="grid" id="examGrid"></div>
  <script>
    const EXAMS = [
      {n:1, lesson:"Lesson 1", title:"Alan Plays Basketball Every Day", type:"筆試", href:"test1.html", status:"done"},
      {n:2, lesson:"Lesson 2", title:"How Often Do You Clean Your Room?", type:"筆試", status:"todo"},
      {n:3, lesson:"Review 1", title:"Lesson 1～2 總複習", type:"筆試", status:"todo"},
      {n:4, lesson:"Lesson 1～2", title:"聽力測驗一", type:"聽力", href:"test4.html", status:"done"},
      {n:5, lesson:"Lesson 3", title:"What's the Date Today?", type:"筆試", status:"todo"},
      {n:6, lesson:"Lesson 4", title:"How Much Cake Do You Want?", type:"筆試", status:"todo"},
      {n:7, lesson:"Review 2", title:"Lesson 3～4 總複習", type:"筆試", status:"todo"},
      {n:8, lesson:"Lesson 3～4", title:"聽力測驗二", type:"聽力", href:"test8.html", status:"done"},
      {n:9, lesson:"Lesson 5", title:"You Helped Me a Lot", type:"筆試", status:"todo"},
      {n:10, lesson:"Lesson 6", title:"They Got Lots of People Together and Cleaned Up Bali's Beaches", type:"筆試", status:"todo"},
      {n:11, lesson:"Review 3", title:"Lesson 5～6 總複習", type:"筆試", status:"todo"},
      {n:12, lesson:"Lesson 5～6", title:"聽力測驗三", type:"聽力", href:"test12.html", status:"done"}
    ];
    const grid = document.getElementById("examGrid");
    EXAMS.forEach(ex=>{
      const done = ex.status==="done";
      const el = document.createElement(done ? "a" : "div");
      el.className = "card" + (done ? " active" : " disabled");
      if(done) el.href = ex.href;
      el.innerHTML = `
        <div>
          <p class="name">第${ex.n}次平時考・${ex.lesson}${done ? '<span class="badge">A卷</span>' : ''}</p>
          <p class="desc">${ex.title}｜${ex.type}${done ? "" : "・整理中"}</p>
        </div>
        <div class="arrow">${done ? "→" : "…"}</div>`;
      grid.appendChild(el);
    });
  </script>
  <a class="footer-link" href="https://jenlin2002.github.io/english-quiz/">← 回英文文法課程總覽</a>
</main>
</body>
</html>
