<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國中題庫｜總目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --ink:#26332b; --ink-soft:#5b6b5f;
    --chalk-green:#2f4538; --gold:#b5842a; --paper-line:#e3dcc8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.7;}
  header{background:var(--chalk-green);color:#eef2ea;padding:30px 20px 42px;position:relative;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);}
  .inner{max-width:860px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(24px,4vw,32px);margin:10px 0 6px;}
  .sub{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:860px;margin:0 auto;padding:28px 20px 70px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:420px){.grid{grid-template-columns:1fr;}}
  .card{
    display:block;background:#fff;border:1px solid var(--paper-line);border-radius:12px;
    padding:22px 18px;text-decoration:none;color:var(--ink);text-align:center;
    transition:transform .15s,border-color .15s;
  }
  a.card:hover{transform:translateY(-3px);border-color:var(--gold);}
  .card .icon{font-size:30px;margin-bottom:8px;}
  .card .name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;margin:0 0 4px;}
  .card .desc{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .card.disabled{opacity:.5;cursor:default;}
  .badge{
    display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700;
    padding:2px 10px;border-radius:999px;margin-top:10px;
  }
  .badge.ready{background:rgba(181,132,42,0.15);color:var(--gold);}
  .badge.soon{background:rgba(91,107,95,0.12);color:var(--ink-soft);}
  .footer-link{display:block;text-align:center;margin-top:34px;color:var(--chalk-green);text-decoration:none;font-weight:700;font-size:14px;}
  .footer-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a></div>
    <h1>國中題庫</h1>
    <p class="sub">選擇科目，進入該科的段考練習卷</p>
  </div>
</header>
<main>
  <div class="grid" id="subjectGrid"></div>
  <script>
    const SUBJECTS = [
      {icon:"📘", name:"英語", href:"english.html"},
      {icon:"🔢", name:"數學", href:null},
      {icon:"📖", name:"國文", href:null},
      {icon:"🌍", name:"社會", href:null},
      {icon:"🔬", name:"自然", href:null}
    ];
    const grid = document.getElementById("subjectGrid");
    SUBJECTS.forEach(s=>{
      const ready = !!s.href;
      const el = document.createElement(ready ? "a" : "div");
      el.className = "card" + (ready ? "" : " disabled");
      if(ready) el.href = s.href;
      el.innerHTML = `
        <div class="icon">${s.icon}</div>
        <p class="name">${s.name}</p>
        <span class="badge ${ready ? "ready" : "soon"}">${ready ? "已上線" : "即將推出"}</span>`;
      grid.appendChild(el);
    });
  </script>
  <a class="footer-link" href="https://jenlin2002.github.io/">← 回總目錄</a>
</main>
</body>
</html>
