<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段考題庫｜第1次平時考 - Lesson 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec;
    --paper-line:#e3dcc8;
    --ink:#26332b;
    --ink-soft:#5b6b5f;
    --chalk-green:#2f4538;
    --chalk-green-2:#3d5a48;
    --pen-red:#b8433a;
    --pen-red-soft:#f4dedb;
    --ok-green:#3f7d52;
    --ok-green-soft:#dfeee1;
    --gold:#b5842a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.7;
  }
  header.hero{
    background:var(--chalk-green);
    color:#eef2ea;
    padding:28px 20px 40px;
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:repeating-linear-gradient(90deg,var(--paper) 0 18px, transparent 18px 20px);
  }
  .hero-inner{max-width:880px;margin:0 auto;}
  .breadcrumb a{color:#cfe0d1;text-decoration:none;font-size:14px;}
  .breadcrumb a:hover{text-decoration:underline;}
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    margin:10px 0 6px;
  }
  .subtitle{color:#cfe0d1;font-size:15px;margin:0;}
  main{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .tabs{display:flex;gap:8px;}
  .tab-btn{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:15px;
    padding:9px 18px;
    border:2px solid var(--chalk-green);
    background:transparent;
    color:var(--chalk-green);
    border-radius:999px 999px 0 0;
    cursor:pointer;
  }
  .tab-btn[aria-selected="true"]{background:var(--chalk-green);color:#fff;}
  .tab-btn[disabled]{
    opacity:.45;cursor:not-allowed;border-color:var(--ink-soft);color:var(--ink-soft);
  }
  .mode-toggle{display:flex;border:2px solid var(--chalk-green);border-radius:999px;overflow:hidden;}
  .mode-toggle button{
    background:transparent;border:none;padding:8px 16px;font-size:14px;font-weight:700;
    color:var(--chalk-green);cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mode-toggle button.active{background:var(--gold);color:#fff;}
  .mode-toggle button:disabled{opacity:.4;cursor:not-allowed;}

  .score-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:22px;
    font-size:14px;
  }
  .score-bar.show{display:flex;}
  .score-bar strong{font-size:18px;color:var(--gold);}
  .score-bar button{
    background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }

  section.block{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 26px;
    margin-bottom:20px;
  }
  .block h2{
    font-family:"Noto Serif TC",serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk-green);
  }
  .block .meta{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .q{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .q-text{font-size:15.5px;margin-bottom:8px;}
  .q-num{color:var(--gold);font-weight:700;margin-right:4px;}

  .opts{display:grid;gap:8px;}
  .opt{
    display:flex;gap:8px;align-items:flex-start;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:14.5px;
    background:#fffdf8;
  }
  .opt:hover{border-color:var(--chalk-green-2);}
  .opt.selected{border-color:var(--chalk-green-2);background:#eef3ea;}
  .opt.correct{border-color:var(--ok-green);background:var(--ok-green-soft);}
  .opt.wrong{border-color:var(--pen-red);background:var(--pen-red-soft);}
  .opt .tag{font-weight:700;color:var(--ink-soft);}
  .opt.correct .tag{color:var(--ok-green);}
  .opt.wrong .tag{color:var(--pen-red);}
  .opt.disabled{cursor:default;}

  .explain{
    margin-top:8px;font-size:13.5px;color:var(--ink-soft);
    background:#f5f2e8;border-radius:6px;padding:8px 12px;display:none;
  }
  .explain.show{display:block;}

  input.blank, input.line-answer{
    font-family:"Noto Sans TC",sans-serif;
    border:none;border-bottom:2px solid var(--chalk-green-2);
    background:transparent;font-size:15px;padding:2px 4px;
    width:150px;
  }
  input.line-answer{width:100%;margin-top:4px;}
  .check-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mini-btn{
    background:var(--chalk-green);color:#fff;border:none;border-radius:6px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC",sans-serif;
  }
  .mini-btn.secondary{background:transparent;color:var(--chalk-green);border:1.5px solid var(--chalk-green);}
  .feedback{font-size:13.5px;font-weight:700;}
  .feedback.ok{color:var(--ok-green);}
  .feedback.no{color:var(--pen-red);}
  .answer-reveal{
    display:none;margin-top:6px;font-size:14px;color:var(--chalk-green-2);
    background:#eef3ea;border-radius:6px;padding:8px 12px;
  }
  .answer-reveal.show{display:block;}

  .passage{
    background:#f5f2e8;border-radius:8px;padding:14px 16px;margin-bottom:14px;
    font-size:14.5px;white-space:pre-line;
  }
  .passage-label{font-weight:700;color:var(--chalk-green);margin-bottom:4px;display:block;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;color:var(--chalk-green);
    text-decoration:none;font-weight:700;font-size:14px;
  }
  .footer-link:hover{text-decoration:underline;}

  .coming-soon{
    text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;
  }

  @media print{
    header.hero, .controls, .score-bar, .check-row, .mini-btn, .footer-link{display:none !important;}
    body{background:#fff;}
    section.block{border:none;box-shadow:none;padding:8px 0;margin-bottom:14px;}
    .opt.correct{background:none;border:none;font-weight:700;}
    .opt.correct::after{content:" ← 正解";color:var(--pen-red);}
    .opt{border:none;padding:2px 0;}
    .explain{display:block !important;background:none;padding:2px 0;}
    .answer-reveal{display:block !important;background:none;padding:2px 0;}
    main{max-width:100%;padding:0 24px;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="https://jenlin2002.github.io/">🏠 回總目錄</a> ／ 段考題庫</div>
    <h1>第1次平時考・Lesson 1</h1>
    <p class="subtitle">Alan Plays Basketball Every Day｜康軒版七年級英語（二）</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="tabs" id="versionTabs" role="tablist"></div>
    <div class="mode-toggle">
      <button id="quizModeBtn" class="active">✏️ 測驗模式</button>
      <button id="printModeBtn" disabled title="完成測驗並送出成績後才能查看">🖨️ 完整題目與解答（送出成績後解鎖）</button>
    </div>
  </div>

  <div class="score-bar" id="scoreBar">
    <div>目前得分：<strong id="scoreText">0 / 0</strong>（僅計算選擇題與字彙填空）</div>
    <button id="resetBtn">重新作答</button>
  </div>

  <div id="content"></div>

  <a class="footer-link" href="https://jenlin2002.github.io/english-quiz/">← 回英文文法課程總覽</a>
</main>

<script>
const DATA = {
  A: {
    label: "A卷",
    sections: [
      {
        type: "vocab",
        title: "一、文意字彙",
        meta: "20分，每題2分",
        items: [
          {q:"Sorry. I can't go to your party. I m___t study at home today.", answer:"must"},
          {q:"There are a h_____d and ten students in our school—sixty girls and fifty boys.", answer:"hundred"},
          {q:"There are too many people here. Stand by my s___e and don't run around.", answer:"side"},
          {q:"My grandfather gets up at 5:00 and eats b____t at 5:30 every morning.", answer:"breakfast"},
          {q:"Tigers and lions have sharp（尖銳的）t___h. Don't get too close to them.", answer:"teeth"},
          {q:"My sister is a great baseball p____r. She helps her team win lots of games.", answer:"player"},
          {q:"A: Don't worry. We still have some time. We can win the game. B: OK. Let's get the last p____t.", answer:"point"},
          {q:"Helen and Jenny are good friends. They do lots of things t____r.", answer:"together"},
          {q:"Lily always gets bad g____es in math. Her parents are not happy about it.", answer:"grades"},
          {q:"A: Where's Allen? B: He's at the school gym. He is playing t____s with Hank there.", answer:"tennis"}
        ]
      },
      {
        type:"mc",
        title:"二、語法測驗",
        meta:"24分，每題2分",
        items:[
          {q:"Jessie: Do you ___ English after school every day? Tim: Yes, I do. I don't make noise there.",options:["study","is studying","studies","are studying"],correct:0},
          {q:"Cathy: ___ do you do on Wednesdays? Steve: I go to the gym on Wednesdays.",options:["How","What","Who","Where"],correct:1},
          {q:"Ellen ___ have meetings in the afternoon. She is playing tennis with her daughter now.",options:["isn't","aren't","don't","doesn't"],correct:3},
          {q:"I watch basketball games, ___ I don't play basketball.",options:["and","but","so","either"],correct:1},
          {q:"My parents ___ with me every day. It's their favorite（最愛的）time of the day.",options:["chats","chat","is chatting","are chatting"],correct:1},
          {q:"They ___ like this bed. It's too hard.",options:["don't","aren't","can't","doesn't"],correct:0},
          {q:"You must ___ in the classroom. It's dangerous（危險的）.",options:["not running","not run","don't run","doesn't run"],correct:1},
          {q:"Ricky: ___ is the guava? Dora: It's NT$20. It's really sweet（甜的）.",options:["How much","What time","What about","How old"],correct:0},
          {q:"Hurry up! The meeting is very important（重要的）. Let's ___ late.",options:["×","not","be","not be"],correct:3},
          {q:"My brother doesn't like snakes, but I ___.",options:["am","do","does","like"],correct:1},
          {q:"Mary can't play badminton, and her brothers can't, ___. Let's teach（教）them.",options:["too","and","either","but"],correct:2},
          {q:"Mike: What ___ your sister do on Saturday mornings? Ivy: She goes to the English class.",options:["can","do","are","does"],correct:3}
        ]
      },
      {
        type:"mc",
        title:"三、完成句子與對話",
        meta:"6分，每題2分",
        items:[
          {q:"Sam: I love strawberries. Molly: ______ Strawberries are my favorite（最愛）.",options:["Me too.","Sure.","I don't, either.","Don't worry!"],correct:0},
          {q:"Vincent and Beth practice badminton after school every day. They really like that sport. To them, ______.",options:["Beth can only join one school team","they're badminton players","badminton is their lives","a lot can happen"],correct:2},
          {q:"Ivan: I want some juice, but I don't have money（錢）. Larry: Don't worry. ______.",options:["It's cool.","It's on me.","It's a lot of fun.","You are not right."],correct:1}
        ]
      },
      {
        type:"guided",
        title:"四、依提示作答",
        meta:"15分，每題3分",
        items:[
          {prompt:"No, she doesn't like that bag.",hint:"（依畫線部分造原問句）",answer:"Does she like that bag?"},
          {prompt:"I play video games with my friends after school every day.",hint:"（依畫線部分造原問句）",answer:"What do you do with your friends after school every day?"},
          {prompt:"Do you have meetings with Tom every day?",hint:"（否定詳答）",answer:"No, I don't have meetings with Tom every day."},
          {prompt:"I study English every day.",hint:"（將 I 改為 Cathy 並改寫句子）",answer:"Cathy studies English every day."},
          {prompt:"The papaya is NT$95.",hint:"（依畫線部分造原問句）",answer:"How much is the papaya?"}
        ]
      },
      {
        type:"translation",
        title:"五、整句式翻譯",
        meta:"15分，每題3分",
        items:[
          {zh:"Tim 每天打電玩遊戲嗎？",answer:"Does Tim play video games every day?"},
          {zh:"我有兩張這週五晚上那場籃球賽的票。",answer:"I have two tickets for the basketball game this Friday night."},
          {zh:"這些學生每週四放學後不練習網球。",answer:"These students don't practice tennis after school on Thursdays."},
          {zh:"我們的校隊不能輸掉這場棒球比賽。",answer:"Our school team can't lose this baseball game."},
          {zh:"不要到處跑。也不要碰桌上的東西。",answer:"Don't run around. Don't touch the things on the table, either."}
        ]
      },
      {
        type:"cloze",
        title:"六、克漏字測驗",
        meta:"10分，每題2分",
        passage:"Hi, everyone. My name is Tommy Chen. I'm an ultramarathon runner from Taiwan. Running is my favorite sport in the world, and __1__. I __2__ on the sports field from 6 to 8 every morning. Then I have a lot of classes and meetings. My English isn't good. I __3__ chat with the ultramarathon runners from around the world. Now, I study English for a long time in the afternoon every day. I take some part-time jobs in the evening. I want to make money to run in every city around the world. My parents worry __4__ me all the time, but running is my life. I prepare hard and study hard. And I want my parents to be proud of me, __5__. I can do it.",
        items:[
          {options:["I don't like it","I have the tickets","I enjoy it a lot","life is hard for me"],correct:2},
          {options:["win","lose","study","practice"],correct:3},
          {options:["don't","can't","mustn't","am not"],correct:1},
          {options:["for","in","about","with"],correct:2},
          {options:["and","but","about","too"],correct:3}
        ]
      },
      {
        type:"reading",
        title:"七、閱讀測驗",
        meta:"10分，每題2分",
        passages:[
          {
            label:"【A】",
            text:"In Garden City, some people exercise every day, but some people don't enjoy it. Here is a study on that.\nQ1. Do you go jogging one or two times a week? Yes 58.5% / No 41.5%\nQ2. Do you play badminton with your family on weekends? Yes 67.4% / No 32.6%\nQ3. Do you go hiking one or two times a year? Yes 45.8% / No 54.2%",
            items:[
              {q:"What percentage of people in Garden City go hiking one or two times a year?",options:["58.5%","67.4%","45.8%","54.2%"],correct:2},
              {q:"There are 10,000 people in Garden City. How many of them go jogging one or two times a week?",options:["5,850","6,740","4,580","4,150"],correct:0}
            ]
          },
          {
            label:"【B】 FUTURE MEAT",
            text:"I. What is future meat? In fact, future meat is not meat, but it is like meat. There are a lot of special ingredients in future meat. These ingredients are good for us.\nII. Where can we eat future meat? Future meat is from the USA, but you can eat it in some special restaurants around Taiwan. Cooks in Taiwan read a lot of books and study the ways of cooking future meat, and then they can cook it for people.\nIII. How much is future meat? We don't really know about it, but a hamburger with future meat is about one hundred and eighty NT dollars. A lot of people in Taiwan like it, and they eat future meat in the restaurants every day.",
            items:[
              {q:"How much is a hamburger with future meat in Taiwan?",options:["NT$180","NT$275","NT$280","NT$300"],correct:0},
              {q:"Where is future meat from?",options:["The UK","Taiwan","The USA","In fact, there is no future meat in the world."],correct:2},
              {q:"Which is NOT true about future meat?",options:["Its ingredients are good for us.","People in Taiwan don't like future meat.","Cooks study the ways of cooking future meat.","Future meat is like meat, but it is not meat."],correct:1}
            ]
          }
        ]
      }
    ]
  },
  B: null,
  C: null
};

let currentVersion = "A";
let currentMode = "quiz"; // quiz | print

const tabsEl = document.getElementById("versionTabs");
const contentEl = document.getElementById("content");
const scoreBar = document.getElementById("scoreBar");
const scoreText = document.getElementById("scoreText");

function buildTabs(){
  tabsEl.innerHTML = "";
  ["A","B","C"].forEach(v=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.textContent = v + "卷" + (DATA[v] ? "" : "（即將推出）");
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", v===currentVersion ? "true":"false");
    if(!DATA[v]) btn.disabled = true;
    btn.addEventListener("click", ()=>{ currentVersion = v; render(); });
    tabsEl.appendChild(btn);
  });
}

function render(){
  buildTabs();
  window.EXAM_META = { version: currentVersion + "卷", examLabel: "第1次" };
  window.examAnswersRevealed = false;
  const data = DATA[currentVersion];
  if(!data){
    contentEl.innerHTML = `<div class="coming-soon">📄 ${currentVersion}卷內容整理中，之後會陸續加入題庫。</div>`;
    scoreBar.classList.remove("show");
    return;
  }
  contentEl.innerHTML = "";
  data.sections.forEach((sec, si)=> contentEl.appendChild(renderSection(sec, si)));
  if(currentMode==="quiz"){
    scoreBar.classList.add("show");
    updateScore();
  } else {
    scoreBar.classList.remove("show");
    // reveal everything for print/reading mode
    contentEl.querySelectorAll(".explain").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".answer-reveal").forEach(e=>e.classList.add("show"));
    contentEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
    contentEl.querySelectorAll(".opt.is-correct").forEach(o=>o.classList.add("correct"));
  }
}

function renderSection(sec, si){
  const block = document.createElement("section");
  block.className = "block";
  block.innerHTML = `<h2>${sec.title}</h2><p class="meta">${sec.meta}</p>`;

  if(sec.type==="vocab"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}
        &nbsp; <input type="text" class="blank" data-answer="${it.answer}" placeholder="填入單字">
        <span class="feedback"></span></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const input = q.querySelector("input");
      input.addEventListener("input", ()=>checkBlank(input));
      block.appendChild(q);
    });
  }

  else if(sec.type==="mc"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div>
        <div class="opts">${optsHtml}</div>
        ${it.explain ? `<div class="explain">${it.explain}</div>` : ""}`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="guided" || sec.type==="translation"){
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const prompt = sec.type==="guided" ? `${it.prompt} <em style="color:var(--ink-soft);font-style:normal;">${it.hint}</em>` : it.zh;
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${prompt}</div>
        <input type="text" class="line-answer" data-answer="${it.answer}" placeholder="請輸入英文句子">
        <div class="check-row"><button class="mini-btn secondary reveal-btn" style="display:none;">對答案</button></div>
        <div class="answer-reveal">正解：${it.answer}</div>`;
      const lineInput = q.querySelector("input.line-answer");
      lineInput.addEventListener("input", ()=>checkLineAnswer(lineInput));
      q.querySelector(".reveal-btn").addEventListener("click", (e)=>{
        q.querySelector(".answer-reveal").classList.add("show");
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="cloze"){
    const passageDiv = document.createElement("div");
    passageDiv.className = "passage";
    passageDiv.textContent = sec.passage;
    block.appendChild(passageDiv);
    sec.items.forEach((it,i)=>{
      const q = document.createElement("div");
      q.className = "q";
      const optsHtml = it.options.map((op,oi)=>`
        <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
          <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
        </div>`).join("");
      q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span></div><div class="opts">${optsHtml}</div>`;
      q.querySelectorAll(".opt").forEach(optEl=>{
        if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
        optEl.addEventListener("click", ()=>selectOption(q, optEl));
      });
      block.appendChild(q);
    });
  }

  else if(sec.type==="reading"){
    sec.passages.forEach(p=>{
      const passageDiv = document.createElement("div");
      passageDiv.className = "passage";
      passageDiv.innerHTML = `<span class="passage-label">${p.label}</span>${p.text}`;
      block.appendChild(passageDiv);
      p.items.forEach((it,i)=>{
        const q = document.createElement("div");
        q.className = "q";
        const optsHtml = it.options.map((op,oi)=>`
          <div class="opt" data-idx="${oi}" data-correct="${oi===it.correct}">
            <span class="tag">(${String.fromCharCode(65+oi)})</span><span>${op}</span>
          </div>`).join("");
        q.innerHTML = `<div class="q-text"><span class="q-num">${i+1}.</span>${it.q}</div><div class="opts">${optsHtml}</div>`;
        q.querySelectorAll(".opt").forEach(optEl=>{
          if(optEl.dataset.correct==="true") optEl.classList.add("is-correct");
          optEl.addEventListener("click", ()=>selectOption(q, optEl));
        });
        block.appendChild(q);
      });
    });
  }

  return block;
}

function selectOption(qEl, optEl){
  if(currentMode!=="quiz") return;
  if(qEl.dataset.answered==="true") return;
  qEl.dataset.answered = "true";
  qEl.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  optEl.classList.add("selected");
  const correctOpt = qEl.querySelector('.opt[data-correct="true"]');
  qEl.dataset.studentAnswer = optEl.textContent.trim();
  qEl.dataset.correctAnswer = correctOpt ? correctOpt.textContent.trim() : "";
  qEl.dataset.isCorrect = (optEl.dataset.correct==="true") ? "true" : "false";
  updateScore();
}

function normalizeAnswer(s){
  return s.trim().toLowerCase().replace(/[.!?]+$/,"").replace(/\s+/g," ");
}

function checkLineAnswer(input){
  const val = input.value.trim();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = val;
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (normalizeAnswer(val) === normalizeAnswer(input.dataset.answer)) ? "true" : "false";
  }
  updateScore();
}

function checkBlank(input){
  const val = input.value.trim().toLowerCase();
  const ans = input.dataset.answer.trim().toLowerCase();
  const qEl = input.closest(".q");
  if(val.length===0){ if(qEl) delete qEl.dataset.studentAnswer; updateScore(); return; }
  if(qEl){
    qEl.dataset.studentAnswer = input.value.trim();
    qEl.dataset.correctAnswer = input.dataset.answer;
    qEl.dataset.isCorrect = (val===ans) ? "true" : "false";
  }
  updateScore();
}

function updateScore(){
  let total = 0, answered = 0, correct = 0;
  contentEl.querySelectorAll(".q").forEach(q=>{
    const gradable = q.querySelector(".opts") || q.querySelector("input.blank") || q.querySelector("input.line-answer");
    if(!gradable) return;
    total++;
    if(q.dataset.studentAnswer !== undefined){
      answered++;
      if(q.dataset.isCorrect === "true") correct++;
    }
  });
  if(window.examAnswersRevealed){
    scoreText.textContent = `${correct} / ${total}`;
  } else {
    scoreText.textContent = `已作答 ${answered} / ${total} 題`;
  }
}
window.updateScore = updateScore;

document.getElementById("resetBtn").addEventListener("click", render);
document.getElementById("quizModeBtn").addEventListener("click", ()=>{
  currentMode = "quiz";
  document.getElementById("quizModeBtn").classList.add("active");
  document.getElementById("printModeBtn").classList.remove("active");
  render();
});
document.getElementById("printModeBtn").addEventListener("click", ()=>{
  if(document.getElementById("printModeBtn").disabled) return;
  currentMode = "print";
  document.getElementById("printModeBtn").classList.add("active");
  document.getElementById("quizModeBtn").classList.remove("active");
  render();
});

window.unlockPrintMode = function(){
  document.getElementById("printModeBtn").disabled = false;
};

render();
</script>
<script src="sync.js"></script>
</body>
</html>
